<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wikigacha</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#141826">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
<style>
  :root {
    --night:     #141826;
    --night-up:  #1e2334;
    --night-line:#2c3348;
    --ivory:     #f6f1e4;
    --ivory-dim: #e5dcc8;
    --ink:       #262119;
    --ink-soft:  #6d6555;
    --glass:     #b9c0d4;
    --glass-dim: #7c85a0;

    --t1: #8d93a3;
    --t2: #4f8d72;
    --t3: #3f79c4;
    --t4: #8b5cc7;
    --t5: #c9992e;
    --t6: #cc4c3f;

    --display: "Fraunces", Georgia, "Times New Roman", serif;
    --sans: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { background: var(--night); }
  body {
    margin: 0 auto; max-width: 640px; padding: 0 16px 56px;
    font-family: var(--sans); color: var(--glass);
    background:
      radial-gradient(120% 60% at 50% 0%, #1d2336 0%, transparent 70%),
      var(--night);
    min-height: 100vh;
    -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
  }

  .masthead { padding: 26px 0 0; }
  .masthead h1 {
    font-family: var(--display); font-weight: 600; font-size: 36px;
    line-height: 1; margin: 0; color: var(--ivory); letter-spacing: -0.015em;
  }
  .tagline { margin: 8px 0 16px; font-size: 13px; color: var(--glass-dim); }
  .tabs { display: flex; gap: 5px; margin-bottom: 22px; }
  .tab {
    flex: 1; padding: 10px 4px; font: inherit; font-size: 12px;
    background: var(--night-up); color: var(--glass);
    border: 1px solid var(--night-line); cursor: pointer;
  }
  .tab.is-active { background: var(--ivory); color: var(--ink); border-color: var(--ivory); }
  :focus-visible { outline: 2px solid var(--t3); outline-offset: 2px; }
  #coll-count { opacity: .7; font-variant-numeric: tabular-nums; }

  /* --- paquet --- */
  .packs {
    margin: 0 0 4px; padding-bottom: 12px; text-align: center;
    font-size: 12px; color: var(--glass-dim);
    border-bottom: 1px solid var(--night-line);
    font-variant-numeric: tabular-nums;
  }
  .pack-stage { text-align: center; padding: 30px 0 10px; }
  .pack {
    width: 176px; height: 248px; cursor: pointer; position: relative;
    border: 1px solid #3a4260;
    background:
      repeating-linear-gradient(135deg, transparent 0 9px, rgba(255,255,255,.022) 9px 18px),
      linear-gradient(165deg, #2b3149 0%, #191d2c 100%);
    color: var(--ivory);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    box-shadow: 0 14px 34px rgba(0,0,0,.5), inset 0 0 0 6px rgba(201,153,46,.13);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .pack:active { transform: translateY(3px) scale(.985); box-shadow: 0 8px 20px rgba(0,0,0,.5); }
  .pack-w {
    font-family: var(--display); font-size: 78px; line-height: 1;
    background: linear-gradient(160deg, #f3dfa4, #c9992e 55%, #f6ecc9);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .pack-label { font-size: 11px; letter-spacing: .12em; color: var(--glass-dim); }
  .pack[disabled] { opacity: .4; }
  .hint { font-size: 12px; color: var(--glass-dim); margin: 16px 0 0; }

  /* --- révélation --- */
  .reveal { padding: 18px 0 8px; text-align: center; }
  .counter { font-size: 12px; color: var(--glass-dim); margin: 0 0 16px; font-variant-numeric: tabular-nums; }
  .flipper {
    width: 100%; max-width: 296px; margin: 0 auto;
    aspect-ratio: 5 / 7; position: relative; perspective: 1300px; cursor: pointer;
  }
  .flip-inner {
    position: absolute; inset: 0; transform-style: preserve-3d;
    transition: transform .6s cubic-bezier(.28,.9,.32,1);
  }
  .flipper.is-open .flip-inner { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; overflow: hidden;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    display: flex; flex-direction: column;
    box-shadow: 0 16px 38px rgba(0,0,0,.55);
  }
  .face-back {
    align-items: center; justify-content: center; gap: 10px;
    border: 1px solid #3a4260; color: var(--ivory);
    background:
      repeating-linear-gradient(135deg, transparent 0 9px, rgba(255,255,255,.022) 9px 18px),
      linear-gradient(165deg, #2b3149 0%, #191d2c 100%);
    box-shadow: 0 16px 38px rgba(0,0,0,.55), inset 0 0 0 6px rgba(201,153,46,.13);
  }
  .face-back .pack-w { font-size: 84px; }
  .face-back small { font-size: 10px; letter-spacing: .14em; color: var(--glass-dim); }

  .face-front {
    transform: rotateY(180deg); text-align: left;
    background: var(--ivory); color: var(--ink);
    border: 1px solid var(--tier, var(--t1));
    padding: 10px;
  }
  .ribbon {
    font-size: 10px; letter-spacing: .12em; text-align: center;
    padding: 5px 0; margin: -10px -10px 10px;
    background: var(--tier); color: #fff;
  }
  .fig {
    flex: 1 1 auto; min-height: 60px; overflow: hidden;
    border: 1px solid var(--ivory-dim); background: #efe8d6;
    display: grid; place-items: center;
  }
  .fig img, .fig .art { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-thumb-alt { padding: 0; overflow: hidden; }
  .card-thumb-alt .art { width: 100%; height: 100%; display: block; }
  .sheet-art {
    height: 150px; overflow: hidden; border: 1px solid var(--ivory-dim); margin-bottom: 15px;
  }
  .sheet-art .art { width: 100%; height: 100%; display: block; }
  .face-front h2 {
    flex: 0 0 auto;
    font-family: var(--display); font-weight: 600; font-size: 19px;
    line-height: 1.15; margin: 10px 0 4px;
  }
  .face-front > p {
    flex: 0 0 auto; margin: 0;
    font-size: 12px; line-height: 1.45; color: var(--ink-soft);
    max-height: 4.35em; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
  }
  .face-foot {
    flex: 0 0 auto; align-items: center;
    display: flex; gap: 14px; margin-top: 9px; padding-top: 8px;
    border-top: 1px solid var(--ivory-dim); font-size: 12px; color: var(--ink-soft);
  }
  .face-foot b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .more {
    margin-left: auto; font: inherit; font-size: 11px; cursor: pointer;
    padding: 3px 8px; color: var(--tier); background: transparent;
    border: 1px solid var(--tier); border-radius: 0;
  }

  .flipper.foil .face-front::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(115deg,
      transparent 28%, rgba(255,255,255,.9) 46%,
      rgba(255,236,180,.75) 54%, transparent 72%);
    transform: translateX(-130%);
  }
  .flipper.foil.is-open .face-front::after { animation: sweep 1.1s .45s ease-out; }
  @keyframes sweep { to { transform: translateX(130%); } }

  .flipper.holo .face-front::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1;
    mix-blend-mode: color; opacity: 0;
    background: linear-gradient(125deg, #ff6b8a, #ffd166, #4ade9b, #4cc9f0, #b57bff, #ff6b8a);
    background-size: 300% 300%;
  }
  .flipper.holo.is-open .face-front::before { animation: holo 3.4s .5s ease-in-out infinite; }
  @keyframes holo {
    0%, 100% { opacity: .18; background-position: 0% 50%; }
    50%      { opacity: .34; background-position: 100% 50%; }
  }

  .tap-on { font-size: 12px; color: var(--glass-dim); margin: 18px 0 0; }

  /* --- listes --- */
  .draw, .grid { display: grid; gap: 10px; padding: 10px 0 20px; }
  @media (min-width: 470px) { .grid { grid-template-columns: 1fr 1fr; } }

  .card {
    display: block; width: 100%; text-align: left; cursor: pointer;
    font: inherit; color: var(--glass);
    background: var(--night-up);
    border: 1px solid var(--night-line);
    border-left: 5px solid var(--tier, var(--t1));
    padding: 11px 13px;
  }
  .card-head { display: flex; gap: 12px; align-items: flex-start; }
  .card-thumb, .card-thumb-alt {
    width: 54px; height: 54px; flex: none;
    border: 1px solid var(--night-line); background: #262c40;
  }
  .card-thumb { object-fit: cover; }
  .card-thumb-alt {
    display: grid; place-items: center;
    font-family: var(--display); font-size: 24px; color: var(--glass-dim);
  }
  .card-title {
    display: block; font-family: var(--display); font-size: 17px;
    line-height: 1.2; margin-bottom: 3px; color: var(--ivory);
  }
  .card-desc {
    display: -webkit-box; font-size: 12px; color: var(--glass-dim);
    -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card-foot {
    display: flex; align-items: baseline; gap: 14px; margin-top: 9px;
    padding-top: 8px; border-top: 1px solid var(--night-line);
    font-size: 12px; color: var(--glass-dim);
  }
  .card-foot b { color: var(--ivory); font-variant-numeric: tabular-nums; }
  .rank { margin-left: auto; font-size: 10px; letter-spacing: .1em; color: var(--tier); }
  .dupe { font-size: 11px; }

  .status { font-size: 13px; color: var(--glass-dim); padding: 26px 4px; text-align: center; }
  .status.error { color: #ef8b8b; }
  .btn {
    display: block; width: 100%; margin: 8px 0 0; padding: 13px;
    background: var(--night-up); border: 1px solid var(--night-line);
    font: inherit; font-size: 15px; color: var(--ivory); cursor: pointer; text-align: center;
  }
  .btn:active { background: #262c40; }
  .btn-solid { background: var(--ivory); color: var(--ink); border-color: var(--ivory); }
  .empty { text-align: center; padding: 52px 0 24px; color: var(--glass-dim); font-size: 14px; }
  .coll-stats {
    font-size: 12px; color: var(--glass-dim); line-height: 1.7;
    border-bottom: 1px solid var(--night-line); padding-bottom: 12px; margin-bottom: 16px;
  }
  .coll-stats b { color: var(--ivory); font-variant-numeric: tabular-nums; }
  .ladder { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .pip {
    font-size: 10px; letter-spacing: .08em; padding: 3px 8px;
    border: 1px solid currentColor; opacity: .85;
  }

  /* --- raid --- */
  .boss {
    background: var(--night-up); border: 1px solid var(--night-line);
    border-top: 4px solid var(--tier, var(--t6)); padding: 16px; margin-bottom: 16px;
  }
  .boss-tag {
    font-size: 10px; letter-spacing: .14em; color: var(--tier); margin: 0 0 6px;
  }
  .boss h2 {
    font-family: var(--display); font-weight: 600; font-size: 23px;
    line-height: 1.15; margin: 0 0 8px; color: var(--ivory);
  }
  .boss-img {
    width: 100%; height: 130px; object-fit: cover;
    border: 1px solid var(--night-line); margin-bottom: 12px;
  }
  .boss-art { height: 130px; overflow: hidden; border: 1px solid var(--night-line); margin-bottom: 12px; }
  .boss-art .art { width: 100%; height: 100%; display: block; }
  .boss p { margin: 0 0 12px; font-size: 13px; line-height: 1.6; color: var(--glass-dim); }
  .bar {
    height: 20px; background: #11141f; border: 1px solid var(--night-line);
    position: relative; overflow: hidden;
  }
  .bar span {
    position: absolute; inset: 0 auto 0 0; background: var(--tier);
    transition: width .5s ease;
  }
  .bar b {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-size: 11px; color: #fff; font-variant-numeric: tabular-nums;
    text-shadow: 0 1px 2px rgba(0,0,0,.6);
  }
  .boss-meta {
    display: flex; gap: 16px; margin-top: 10px;
    font-size: 12px; color: var(--glass-dim);
  }
  .boss-meta b { color: var(--ivory); font-variant-numeric: tabular-nums; }
  .paliers { display: flex; gap: 6px; margin-top: 12px; }
  .palier {
    flex: 1; text-align: center; font-size: 10px; line-height: 1.5; padding: 6px 2px;
    color: var(--glass-dim); background: transparent;
    border: 1px solid var(--night-line);
    font-family: inherit; font-variant-numeric: tabular-nums;
  }
  .palier.pret {
    color: #1a1d29; background: linear-gradient(160deg, #f3dfa4, #c9992e);
    border-color: #c9992e; font-weight: 600; cursor: pointer;
    animation: pulse 1.8s ease-in-out infinite;
  }
  .palier.pret:active { transform: translateY(1px); }
  .palier.pris { color: #c9992e; border-color: #6a5520; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(201,153,46,.5); }
    50%      { box-shadow: 0 0 0 5px rgba(201,153,46,0); }
  }
  .recompense-msg {
    margin: 8px 0 0; font-size: 11px; color: #c9992e; min-height: 14px;
  }
  .puissance {
    font-size: 12px; line-height: 1.6; color: var(--glass-dim); margin: 0 0 4px;
  }
  .puissance b { color: var(--ivory); font-variant-numeric: tabular-nums; }
  .raid-title {
    font-size: 12px; letter-spacing: .1em; color: var(--glass-dim);
    margin: 20px 0 10px; padding-bottom: 8px; border-bottom: 1px solid var(--night-line);
  }
  .fighter {
    display: flex; align-items: center; gap: 12px; width: 100%;
    padding: 10px 12px; margin-bottom: 8px; cursor: pointer;
    font: inherit; color: var(--glass); text-align: left;
    background: var(--night-up); border: 1px solid var(--night-line);
    border-left: 4px solid var(--tier);
  }
  .fighter:disabled { opacity: .4; cursor: default; }
  .fighter-name {
    flex: 1 1 auto; min-width: 0; font-family: var(--display); font-size: 15px;
    color: var(--ivory); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .fighter-dmg { flex: none; font-size: 13px; color: var(--tier); font-variant-numeric: tabular-nums; }
  .journal {
    font-size: 12px; line-height: 1.8; color: var(--glass-dim);
    border-top: 1px solid var(--night-line); padding-top: 10px; margin-top: 4px;
  }
  .journal b { color: var(--ivory); }
  .win {
    background: var(--night-up); border: 1px solid #c9992e;
    padding: 16px; margin-bottom: 16px; text-align: center;
  }
  .win h3 {
    font-family: var(--display); font-size: 20px; margin: 0 0 6px; color: #f0dda4;
  }
  .win p { margin: 0; font-size: 13px; color: var(--glass-dim); }

  /* --- echange --- */
  .echange {
    border: 1px solid var(--night-line); background: var(--night-up);
    padding: 12px 13px; margin-bottom: 18px;
  }
  .echange-lab {
    display: block; font-size: 11px; letter-spacing: .1em;
    color: var(--glass-dim); margin-bottom: 8px;
  }
  .echange-ligne { display: flex; gap: 8px; }
  .code-champ {
    flex: 1 1 auto; min-width: 0; padding: 10px;
    background: #11141f; border: 1px solid var(--night-line);
    color: var(--ivory); font: inherit; font-size: 13px;
  }
  .code-champ::placeholder { color: var(--glass-dim); opacity: .7; }
  .echange-btn { flex: none; width: auto; margin: 0; padding: 10px 16px; }
  .code-zone {
    width: 100%; margin-bottom: 16px; padding: 10px;
    background: #fff; border: 1px solid var(--ivory-dim);
    color: var(--ink); font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 12px; line-height: 1.5; word-break: break-all; resize: vertical;
  }

  /* --- succes --- */
  .succes-tete {
    font-size: 12px; color: var(--glass-dim); line-height: 1.7;
    border-bottom: 1px solid var(--night-line); padding-bottom: 12px; margin-bottom: 18px;
  }
  .succes-tete b { color: var(--ivory); font-variant-numeric: tabular-nums; }
  .succes-groupe {
    font-size: 11px; letter-spacing: .12em; color: var(--glass-dim);
    margin: 22px 0 10px;
  }
  .succes {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    font: inherit; color: var(--glass); cursor: default;
    background: var(--night-up); border: 1px solid var(--night-line);
    border-left: 4px solid var(--night-line); padding: 11px 13px; margin-bottom: 8px;
  }
  .succes-txt { flex: 1 1 auto; min-width: 0; }
  .succes-nom {
    display: block; font-family: var(--display); font-size: 15px; color: var(--glass-dim);
  }
  .succes-desc { display: block; font-size: 12px; color: var(--glass-dim); opacity: .75; }
  .succes-gain {
    flex: none; font-size: 11px; color: var(--glass-dim);
    border: 1px solid var(--night-line); padding: 4px 8px; white-space: nowrap;
  }
  .succes.fait { border-left-color: #c9992e; }
  .succes.fait .succes-nom { color: var(--ivory); }
  .succes.pret {
    border-left-color: #c9992e; cursor: pointer;
    animation: pulse 1.8s ease-in-out infinite;
  }
  .succes.pret .succes-nom { color: var(--ivory); }
  .succes.pret .succes-gain {
    color: #1a1d29; font-weight: 600;
    background: linear-gradient(160deg, #f3dfa4, #c9992e); border-color: #c9992e;
  }
  .succes.fait .succes-gain { color: #c9992e; border-color: #6a5520; }
  .succes-prog {
    display: block; margin-top: 5px; font-size: 11px;
    color: var(--glass-dim); font-variant-numeric: tabular-nums;
  }
  .jauge {
    height: 3px; background: var(--night-line); margin-top: 4px; position: relative;
  }
  .jauge span { position: absolute; inset: 0 auto 0 0; background: #c9992e; }

  /* --- fiche --- */
  .sheet {
    position: fixed; inset: 0; z-index: 20; background: rgba(8,10,17,.66);
    display: flex; align-items: flex-end; justify-content: center;
  }
  .sheet[hidden] { display: none; }
  .sheet-inner {
    width: 100%; max-width: 640px; max-height: 88vh; overflow-y: auto;
    background: var(--ivory); color: var(--ink);
    border-top: 4px solid var(--tier, var(--t1));
    padding: 20px 18px 30px; animation: rise .26s ease-out;
  }
  @keyframes rise { from { transform: translateY(26px); opacity: 0; } }
  .sheet-inner h2 {
    font-family: var(--display); font-weight: 600; font-size: 25px;
    line-height: 1.15; margin: 0 0 3px;
  }
  .sheet-sub { margin: 0 0 15px; font-size: 11px; letter-spacing: .1em; color: var(--tier); }
  .sheet-img {
    width: 100%; max-height: 210px; object-fit: cover;
    border: 1px solid var(--ivory-dim); margin-bottom: 15px;
  }
  .sheet-text { font-size: 15px; line-height: 1.68; margin: 0 0 16px; }
  .sheet-meta {
    font-size: 12px; color: var(--ink-soft); line-height: 1.9;
    border-top: 1px solid var(--ivory-dim); padding-top: 11px; margin-bottom: 16px;
  }
  .sheet-meta b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .sheet-actions { display: flex; gap: 10px; }
  .sheet-actions .btn {
    margin: 0; background: #fff; border-color: var(--ivory-dim);
    color: var(--ink); text-decoration: none;
  }
  .btn-offrir {
    margin-top: 10px; background: transparent;
    border-color: var(--ivory-dim); color: var(--ink-soft); font-size: 13px;
  }

  .credit {
    font-size: 11px; color: var(--glass-dim); line-height: 1.7;
    border-top: 1px solid var(--night-line); padding-top: 14px; margin-top: 10px;
  }
  .credit a { color: var(--glass); }

  @media (prefers-reduced-motion: reduce) {
    .flip-inner, .pack { transition: none; }
    .sheet-inner, .flipper.foil.is-open .face-front::after,
    .flipper.holo.is-open .face-front::before { animation: none; }
  }
</style>
</head>
<body>

<header class="masthead">
  <h1>Wikigacha</h1>
  <p class="tagline">Cinq articles au hasard. À vous de voir ce que ça vaut.</p>
  <nav class="tabs">
    <button id="tab-open" class="tab is-active">Ouvrir</button>
    <button id="tab-coll" class="tab">Collection <span id="coll-count">(0)</span></button>
    <button id="tab-raid" class="tab">Raid</button>
    <button id="tab-succes" class="tab">Succès <span id="succes-count"></span></button>
  </nav>
</header>

<main id="view-open">
  <p id="packs" class="packs"></p>
  <div id="pack-stage" class="pack-stage">
    <button id="pack" class="pack" aria-label="Ouvrir un paquet de cinq cartes">
      <span class="pack-w">W</span>
      <span class="pack-label">5 CARTES</span>
    </button>
    <p class="hint">Touchez le paquet</p>
  </div>

  <div id="reveal" class="reveal" hidden>
    <p id="counter" class="counter"></p>
    <div id="flipper" class="flipper" role="button" tabindex="0">
      <div class="flip-inner">
        <div class="face face-back">
          <span class="pack-w">W</span>
          <small>ARTICLE INCONNU</small>
        </div>
        <div class="face face-front" id="front"></div>
      </div>
    </div>
    <p id="tap-on" class="tap-on">Touchez la carte pour la retourner</p>
  </div>

  <div id="draw" class="draw"></div>
  <div id="status" class="status" hidden></div>
  <button id="again" class="btn btn-solid" hidden>Ouvrir un autre paquet</button>
</main>

<main id="view-coll" hidden>
  <div class="echange">
    <label class="echange-lab" for="code-champ">Recevoir une carte</label>
    <div class="echange-ligne">
      <input id="code-champ" class="code-champ" type="text"
             placeholder="Collez un code WG1-…" autocomplete="off" spellcheck="false">
      <button id="code-valider" class="btn echange-btn">Recevoir</button>
    </div>
    <p class="recompense-msg" id="echange-msg"></p>
  </div>
  <div id="coll-empty" class="empty">
    <p>Votre collection est vide.</p>
    <button id="goto-open" class="btn btn-solid">Ouvrir un premier paquet</button>
  </div>
  <div id="coll-stats" class="coll-stats" hidden></div>
  <div id="coll-grid" class="grid"></div>
</main>

<main id="view-raid" hidden>
  <div id="raid-body"></div>
</main>

<main id="view-succes" hidden>
  <div id="succes-body"></div>
</main>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-inner" id="sheet-inner"></div>
</div>

<p class="credit">
  Contenu et données issus de <a href="https://fr.wikipedia.org" target="_blank" rel="noopener">Wikipédia</a>,
  sous licence <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.fr" target="_blank" rel="noopener">CC BY-SA 4.0</a>.
</p>

<script>
(function () {
  var WIKI = 'fr.wikipedia';
  var KEY = 'wikigacha:collection';
  var collection = {};
  var queue = [], qi = 0;

  /* Sept paliers, calques sur ceux du jeu original.
     Le seuil porte sur le score de qualite WikiRank (0-100). */
  var TIERS = [
    { max: 12,  name: 'Commune',            short: 'C',   color: '#8d93a3', fx: '' },
    { max: 20,  name: 'Peu commune',        short: 'PC',  color: '#4f8d72', fx: '' },
    { max: 30,  name: 'Rare',               short: 'R',   color: '#3f79c4', fx: '' },
    { max: 44,  name: 'Super rare',         short: 'SR',  color: '#8b5cc7', fx: 'foil' },
    { max: 60,  name: 'Super spéciale rare',short: 'SSR', color: '#c46a2f', fx: 'foil' },
    { max: 82,  name: 'Ultra rare',         short: 'UR',  color: '#c9992e', fx: 'foil' },
    { max: 999, name: 'Légende rare',       short: 'LR',  color: '#cc4c3f', fx: 'foil holo' }
  ];
  var PITIE = 3;          /* palier garanti : Super rare (indice 3) */
  var PITIE_TOUS = 10;    /* ... une fois tous les dix paquets */
  var MAX_PAQUETS = 10;
  var REGEN_MS = 60000;

  /* Medianes de reference, calees sur les articles de qualite francophones.
     C'est la logique WikiRank : chaque mesure est ramenee a ce niveau. */
  var MEDIANES = { len: 60000, refs: 100, img: 18, sec: 20, reflen: 16.7 };
  var POIDS    = { len: 0.35,  refs: 0.30, img: 0.15, sec: 0.10, reflen: 0.10 };

  var el = function (id) { return document.getElementById(id); };
  var tierOf = function (name) {
    return TIERS.find(function (t) { return t.name === name; }) || TIERS[0];
  };
  var rankIndex = function (name) {
    return TIERS.findIndex(function (t) { return t.name === name; });
  };
  var esc = function (s) {
    return String(s).replace(/[&<>"]/g, function (m) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[m];
    });
  };

  /* ---------- données ---------- */

  function fetchPack() {
    var url = 'https://' + WIKI + '.org/w/api.php'
      + '?action=query&format=json&origin=*'
      + '&generator=random&grnnamespace=0&grnlimit=5'
      + '&prop=info|pageimages|description|extracts'
      + '&inprop=url&piprop=thumbnail&pithumbsize=500'
      + '&exintro=1&explaintext=1&exlimit=max';
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (d) {
      var pages = d && d.query && d.query.pages;
      if (!pages) throw new Error('reponse vide');
      return Object.keys(pages).map(function (k) { return pages[k]; });
    });
  }

  function viewRange() {
    var n = new Date();
    var s = new Date(Date.UTC(n.getUTCFullYear(), n.getUTCMonth() - 2, 1));
    var e = new Date(Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), 0));
    var f = function (d) { return d.toISOString().slice(0, 10).replace(/-/g, '') + '00'; };
    return [f(s), f(e)];
  }

  function fetchViews(title) {
    var r = viewRange();
    var url = 'https://wikimedia.org/api/rest_v1/metrics/pageviews/per-article/'
      + WIKI + '/all-access/user/' + encodeURIComponent(title.replace(/ /g, '_'))
      + '/monthly/' + r[0] + '/' + r[1];
    return fetch(url)
      .then(function (res) { return res.ok ? res.json() : null; })
      .then(function (d) {
        if (!d || !d.items) return 0;
        return d.items.reduce(function (s, i) { return s + (i.views || 0); }, 0);
      })
      .catch(function () { return 0; });
  }

  /* Les cinq mesures de qualite, en un appel par article. */
  function fetchQuality(pageid) {
    var url = 'https://' + WIKI + '.org/w/api.php'
      + '?action=parse&format=json&origin=*&pageid=' + pageid
      + '&prop=sections|externallinks|images';
    return fetch(url)
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        var pr = d && d.parse;
        if (!pr) return null;
        return {
          refs: (pr.externallinks || []).length,
          img:  (pr.images || []).length,
          sec:  (pr.sections || []).length
        };
      })
      .catch(function () { return null; });
  }

  function qualityScore(bytes, q) {
    var norm = function (v, m) { return Math.min(1, v / m); };
    if (!q) {
      /* Repli si l'appel echoue : on ne garde que la longueur. */
      return norm(bytes, MEDIANES.len) * 100 * 0.55;
    }
    var nlen = norm(bytes, MEDIANES.len);
    var reflen = q.refs / Math.max(0.1, bytes / 10000);
    /* La densite de references sature des la premiere note dans une ebauche.
       On la pondere par la longueur : bien sourcer n'a de valeur qu'avec du fond. */
    return 100 * (
      POIDS.len    * nlen
    + POIDS.refs   * norm(q.refs, MEDIANES.refs)
    + POIDS.img    * norm(q.img,  MEDIANES.img)
    + POIDS.sec    * norm(q.sec,  MEDIANES.sec)
    + POIDS.reflen * norm(reflen, MEDIANES.reflen) * nlen
    );
  }

  function fetchSummary(title) {
    var url = 'https://' + WIKI + '.org/api/rest_v1/page/summary/'
      + encodeURIComponent(title.replace(/ /g, '_'));
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }

  function toCard(page, views, q) {
    var bytes = page.length || 1;
    var score = qualityScore(bytes, q);
    var tier = TIERS.find(function (t) { return score < t.max; });
    return {
      score: Math.round(score * 10) / 10,
      refs: q ? q.refs : null, img: q ? q.img : null, sec: q ? q.sec : null,
      title: page.title,
      url: page.fullurl || ('https://' + WIKI + '.org/wiki/' + encodeURIComponent(page.title)),
      desc: page.description || '',
      extract: (page.extract || '').trim().slice(0, 1400),
      thumb: page.thumbnail ? page.thumbnail.source : '',
      bytes: bytes, views: views,
      atk: Math.max(1, Math.round(Math.log10(views + 1) * 90)),
      def: Math.max(1, Math.round(Math.log10(bytes + 1) * 90)),
      rank: tier.name
    };
  }

  /* ---------- stockage ---------- */

  function load() {
    try { collection = JSON.parse(localStorage.getItem(KEY)) || {}; }
    catch (e) { collection = {}; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(collection)); } catch (e) {}
  }
  function add(c) {
    var e = collection[c.title];
    if (e) { e.count += 1; }
    else {
      collection[c.title] = {
        title: c.title, url: c.url, desc: c.desc, extract: c.extract, thumb: c.thumb,
        bytes: c.bytes, views: c.views, atk: c.atk, def: c.def,
        score: c.score, refs: c.refs, img: c.img, sec: c.sec,
        rank: c.rank, count: 1
      };
    }
    save(); refreshCount(); refreshSucces();
  }
  /* --- Reserve de paquets : dix au maximum, un de plus par minute. --- */
  var PKEY = 'wikigacha:paquets';

  function readPacks() {
    var d;
    try { d = JSON.parse(localStorage.getItem(PKEY)); } catch (e) { d = null; }
    if (!d || typeof d.n !== 'number') d = { n: MAX_PAQUETS, ts: Date.now(), ouverts: 0 };
    var gagnes = Math.floor((Date.now() - d.ts) / REGEN_MS);
    if (gagnes > 0 && d.n < MAX_PAQUETS) {
      d.n = Math.min(MAX_PAQUETS, d.n + gagnes);
      d.ts = d.n >= MAX_PAQUETS ? Date.now() : d.ts + gagnes * REGEN_MS;
    } else if (d.n >= MAX_PAQUETS) {
      d.ts = Date.now();
    }
    return d;
  }

  function writePacks(d) {
    try { localStorage.setItem(PKEY, JSON.stringify(d)); } catch (e) {}
  }

  function refreshPacks() {
    var d = readPacks();
    writePacks(d);
    var txt = 'Paquets ' + d.n + ' / ' + MAX_PAQUETS;
    if (d.n < MAX_PAQUETS) {
      var reste = Math.max(0, REGEN_MS - (Date.now() - d.ts));
      var sec = Math.ceil(reste / 1000);
      txt += ' · prochain dans ' + Math.floor(sec / 60) + ':'
           + String(sec % 60).padStart(2, '0');
    }
    var vers = PITIE_TOUS - (d.ouverts % PITIE_TOUS);
    txt += ' · garantie dans ' + vers + (vers > 1 ? ' paquets' : ' paquet');
    el('packs').textContent = txt;
    el('pack').disabled = d.n < 1;
    return d;
  }

  function refreshCount() {
    el('coll-count').textContent = '(' + Object.keys(collection).length + ')';
  }

  /* ---------- rendu ---------- */

  function blurb(c, limit) {
    var t = c.extract || c.desc || 'Cet article n\u2019a pas encore de r\u00e9sum\u00e9.';
    if (t.length <= limit) return t;
    var head = t.slice(0, limit + 40);
    var cut = Math.max(
      head.lastIndexOf('. '), head.lastIndexOf('! '),
      head.lastIndexOf('? '), head.lastIndexOf('\u2026 ')
    );
    if (cut > limit * 0.45) return head.slice(0, cut + 1);
    var sp = head.lastIndexOf(' ', limit);
    return (sp > 0 ? head.slice(0, sp) : head.slice(0, limit)) + '\u2026';
  }

  /* Illustration deterministe pour les articles sans image :
     le titre sert de graine, la carte a donc toujours le meme motif. */
  function seedOf(str) {
    var h = 2166136261;
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  function artSVG(title, color) {
    var seed = seedOf(title);
    var rnd = function () {
      seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
      return seed / 4294967296;
    };
    var mode = Math.floor(rnd() * 3);
    var body = '';
    var i, n;

    if (mode === 0) {
      n = 4 + Math.floor(rnd() * 4);
      var cx = 25 + rnd() * 50, cy = 25 + rnd() * 50;
      for (i = n; i > 0; i--) {
        body += '<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1)
          + '" r="' + (i * (8 + rnd() * 4)).toFixed(1)
          + '" fill="none" stroke="' + color
          + '" stroke-opacity="' + (0.10 + i * 0.045).toFixed(2)
          + '" stroke-width="' + (1 + rnd() * 2).toFixed(1) + '"/>';
      }
    } else if (mode === 1) {
      var x = -40;
      while (x < 140) {
        var w = 3 + rnd() * 12;
        body += '<rect x="' + x.toFixed(1) + '" y="-30" width="' + w.toFixed(1)
          + '" height="160" fill="' + color
          + '" fill-opacity="' + (0.06 + rnd() * 0.26).toFixed(2)
          + '" transform="rotate(-24 50 50)"/>';
        x += w + 2 + rnd() * 7;
      }
    } else {
      n = 4 + Math.floor(rnd() * 3);
      var step = 100 / n;
      for (i = 0; i < n * n; i++) {
        if (rnd() < 0.42) continue;
        body += '<rect x="' + ((i % n) * step).toFixed(1)
          + '" y="' + (Math.floor(i / n) * step).toFixed(1)
          + '" width="' + step.toFixed(1) + '" height="' + step.toFixed(1)
          + '" fill="' + color
          + '" fill-opacity="' + (0.05 + rnd() * 0.28).toFixed(2) + '"/>';
      }
    }

    return '<svg class="art" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"'
      + ' xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'
      + '<rect width="100" height="100" fill="#efe8d6"/>' + body
      + '<text x="50" y="50" text-anchor="middle" dominant-baseline="central"'
      + ' font-family="Fraunces, Georgia, serif" font-size="46" font-weight="600"'
      + ' fill="#262119" fill-opacity=".72">' + esc(title.charAt(0).toUpperCase())
      + '</text></svg>';
  }

  function cardHTML(c, dupes) {
    var t = tierOf(c.rank);
    var visual = c.thumb
      ? '<img class="card-thumb" src="' + esc(c.thumb) + '" alt="" loading="lazy">'
      : '<span class="card-thumb-alt">' + artSVG(c.title, t.color) + '</span>';
    return '<button class="card" style="--tier:' + t.color + '" data-title="' + esc(c.title) + '">'
      + '<span class="card-head">' + visual
      + '<span><span class="card-title">' + esc(c.title) + '</span>'
      + '<span class="card-desc">' + esc(blurb(c, 120)) + '</span></span></span>'
      + '<span class="card-foot">'
      + '<span>ATQ <b>' + c.atk + '</b></span>'
      + '<span>DÉF <b>' + c.def + '</b></span>'
      + (dupes > 1 ? '<span class="dupe">×' + dupes + '</span>' : '')
      + '<span class="rank">' + esc(tierOf(c.rank).short) + '</span></span></button>';
  }

  function frontHTML(c) {
    var t = tierOf(c.rank);
    var fig = c.thumb
      ? '<img src="' + esc(c.thumb) + '" alt="">'
      : artSVG(c.title, t.color);
    return '<div class="ribbon">' + esc(c.rank.toUpperCase())
      + (c.garantie ? ' · GARANTIE' : '') + '</div>'
      + '<div class="fig">' + fig + '</div>'
      + '<h2>' + esc(c.title) + '</h2>'
      + '<p>' + esc(blurb(c, 150)) + '</p>'
      + '<div class="face-foot"><span>ATQ <b>' + c.atk + '</b></span>'
      + '<span>DÉF <b>' + c.def + '</b></span>'
      + '<button class="more" data-title="' + esc(c.title) + '">Fiche complète</button>'
      + '</div>';
  }

  /* ---------- révélation ---------- */

  function showNext() {
    if (qi >= queue.length) {
      el('reveal').hidden = true;
      el('draw').innerHTML = queue.map(function (c) { return cardHTML(c, 1); }).join('');
      el('again').hidden = false;
      return;
    }
    var c = queue[qi], t = tierOf(c.rank);
    el('counter').textContent = 'Carte ' + (qi + 1) + ' sur ' + queue.length;
    el('front').innerHTML = frontHTML(c);
    el('front').style.setProperty('--tier', t.color);
    el('flipper').className = 'flipper ' + t.fx;
    el('tap-on').textContent = 'Touchez la carte pour la retourner';
  }

  function onFlip(ev) {
    var f = el('flipper');
    var more = ev && ev.target && ev.target.closest ? ev.target.closest('.more') : null;
    if (more) { openSheet(more.getAttribute('data-title')); return; }
    if (qi >= queue.length) return;
    if (!f.classList.contains('is-open')) {
      f.classList.add('is-open');
      add(queue[qi]);
      el('tap-on').textContent = (qi + 1 < queue.length)
        ? 'Touchez pour la suivante'
        : 'Touchez pour voir le paquet';
    } else {
      f.classList.remove('is-open');
      qi += 1;
      setTimeout(showNext, 260);
    }
  }

  function openPack() {
    var status = el('status');
    var etat = readPacks();
    if (etat.n < 1) {
      status.hidden = false; status.className = 'status';
      status.textContent = 'Plus de paquets. Un nouveau arrive dans moins d’une minute.';
      return;
    }
    etat.n -= 1; etat.ouverts += 1;
    if (etat.n === MAX_PAQUETS - 1) etat.ts = Date.now();
    writePacks(etat);
    var pitie = (etat.ouverts % PITIE_TOUS) === 0;

    el('pack').disabled = true;
    el('draw').innerHTML = '';
    el('again').hidden = true;
    status.hidden = false; status.className = 'status';
    status.textContent = 'Tirage de cinq articles…';

    fetchPack()
      .then(function (pages) {
        return Promise.all(pages.map(function (p) {
          return Promise.all([fetchViews(p.title), fetchQuality(p.pageid)])
            .then(function (r) { return toCard(p, r[0], r[1]); });
        }));
      })
      .then(function (cards) {
        cards.sort(function (a, b) { return rankIndex(a.rank) - rankIndex(b.rank); });
        if (pitie && rankIndex(cards[cards.length - 1].rank) < PITIE) {
          var best = cards[cards.length - 1];
          best.rank = TIERS[PITIE].name;
          best.garantie = true;
        }
        queue = cards; qi = 0;
        status.hidden = true;
        el('pack-stage').hidden = true;
        el('reveal').hidden = false;
        el('flipper').classList.remove('is-open');
        showNext();
        refreshPacks();
        refreshSucces();
      })
      .catch(function (err) {
        /* Le paquet n'a pas abouti : on le rend au joueur. */
        var e2 = readPacks(); e2.n = Math.min(MAX_PAQUETS, e2.n + 1);
        e2.ouverts = Math.max(0, e2.ouverts - 1); writePacks(e2);
        status.className = 'status error';
        status.textContent = 'Wikipédia n’a pas répondu (' + err.message + '). Réessayez.';
        refreshPacks();
      });
  }

  function resetPack() {
    el('pack-stage').hidden = false;
    el('reveal').hidden = true;
    el('draw').innerHTML = '';
    el('again').hidden = true;
  }

  /* ---------- fiche ---------- */

  function openSheet(title) {
    var c = collection[title];
    if (!c) return;
    var t = tierOf(c.rank);
    var inner = el('sheet-inner');
    inner.style.setProperty('--tier', t.color);
    inner.innerHTML = '<h2>' + esc(c.title) + '</h2>'
      + '<p class="sheet-sub">' + esc(c.rank.toUpperCase())
      + (c.count > 1 ? ' · ' + c.count + ' EXEMPLAIRES' : '') + '</p>'
      + (c.thumb
          ? '<img class="sheet-img" src="' + esc(c.thumb) + '" alt="">'
          : '<div class="sheet-art">' + artSVG(c.title, t.color) + '</div>')
      + '<p class="sheet-text" id="sheet-text">'
      + esc(c.extract || 'Chargement du résumé…') + '</p>'
      + '<div class="sheet-meta">ATQ <b>' + c.atk + '</b> — '
      + c.views.toLocaleString('fr-FR') + ' vues sur deux mois<br>'
      + 'DÉF <b>' + c.def + '</b> — '
      + (Math.round(c.bytes / 102.4) / 10) + ' Ko d’article'
      + (typeof c.score === 'number'
          ? '<br>Qualité <b>' + c.score + '</b> / 100'
            + (c.refs !== null && c.refs !== undefined
                ? ' — ' + c.refs + ' références, ' + c.img + ' images, '
                  + c.sec + ' sections'
                : '')
          : '')
      + '</div>'
      + '<div class="sheet-actions">'
      + '<button class="btn" id="sheet-close">Fermer</button>'
      + '<a class="btn" href="' + esc(c.url) + '" target="_blank" rel="noopener">Lire l’article</a>'
      + '</div>'
      + '<button class="btn btn-offrir" id="sheet-offrir" data-offrir="' + esc(c.title) + '">'
      + 'Offrir cette carte' + (c.count > 1 ? ' (vous en avez ' + c.count + ')' : '')
      + '</button>';
    el('sheet').hidden = false;
    document.body.style.overflow = 'hidden';
    el('sheet-close').addEventListener('click', closeSheet);

    if (!c.extract) {
      fetchSummary(c.title)
        .then(function (d) {
          c.extract = (d.extract || '').trim().slice(0, 1400);
          save();
          el('sheet-text').textContent = c.extract || 'Cet article n’a pas de résumé.';
        })
        .catch(function () {
          el('sheet-text').textContent = 'Résumé indisponible.';
        });
    }
  }

  function closeSheet() {
    el('sheet').hidden = true;
    document.body.style.overflow = '';
  }

  /* ---------- statistiques durables ---------- */

  var SKEY = 'wikigacha:stats';

  function readStats() {
    var d;
    try { d = JSON.parse(localStorage.getItem(SKEY)); } catch (e) { d = null; }
    if (!d) d = { boss: 0, coupMax: 0, jours: 1, dernier: null, reclames: [] };
    d.reclames = d.reclames || [];
    return d;
  }
  function writeStats(d) {
    try { localStorage.setItem(SKEY, JSON.stringify(d)); } catch (e) {}
  }

  /* Serie de jours consecutifs, mise a jour au chargement. */
  function pointerPresence() {
    var st = readStats(), a = jour();
    if (st.dernier === a) return st;
    var h = new Date(); h.setDate(h.getDate() - 1);
    var hier = h.getFullYear() + '-' + String(h.getMonth() + 1).padStart(2, '0')
             + '-' + String(h.getDate()).padStart(2, '0');
    st.jours = (st.dernier === hier) ? (st.jours || 1) + 1 : 1;
    st.dernier = a;
    writeStats(st);
    return st;
  }

  /* ---------- raid du jour ----------
     Le boss est l'article du jour de Wikipedia : nouvel adversaire
     chaque matin, choisi par les contributeurs et non par un tirage. */

  var RKEY = 'wikigacha:raid';
  var MULT = [1, 1.3, 1.7, 2.2, 2.9, 3.7, 4.6];    /* multiplicateur par rarete */
  var MAX_COMBATTANTS = 10;   /* dix cartes par jour : la qualite prime sur le nombre */
  /* Paliers de degats : meme sans le vaincre, on progresse. */
  var PALIERS = [
    { seuil: 0.25, gain: 1, nom: 'Quart des PV' },
    { seuil: 0.50, gain: 1, nom: 'Moitié des PV' },
    { seuil: 0.75, gain: 1, nom: 'Trois quarts' },
    { seuil: 1.00, gain: 3, nom: 'Adversaire vaincu' }
  ];

  function jour() {
    var d = new Date();
    return d.getFullYear() + '-'
      + String(d.getMonth() + 1).padStart(2, '0') + '-'
      + String(d.getDate()).padStart(2, '0');
  }

  function fetchBoss() {
    var j = jour().split('-');
    var url = 'https://' + WIKI + '.org/api/rest_v1/feed/featured/'
      + j[0] + '/' + j[1] + '/' + j[2];
    return fetch(url)
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (d) {
        var a = d.tfa || (d.mostread && d.mostread.articles && d.mostread.articles[0]);
        if (!a) throw new Error('pas d’article du jour');
        return a;
      });
  }

  function fetchInfo(pageid) {
    var url = 'https://' + WIKI + '.org/w/api.php'
      + '?action=query&format=json&origin=*&pageids=' + pageid
      + '&prop=info|pageimages|description&inprop=url'
      + '&piprop=thumbnail&pithumbsize=600';
    return fetch(url)
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        var pg = d && d.query && d.query.pages;
        return pg ? pg[Object.keys(pg)[0]] : null;
      })
      .catch(function () { return null; });
  }

  function degats(c, boss) {
    var m = MULT[rankIndex(c.rank)] || 1;
    var reduction = 900 / (900 + boss.def);
    return Math.max(1, Math.round(c.atk * m * reduction));
  }

  function readRaid() {
    var d;
    try { d = JSON.parse(localStorage.getItem(RKEY)); } catch (e) { d = null; }
    if (!d || d.date !== jour()) return null;
    return d;
  }
  function writeRaid(d) {
    try { localStorage.setItem(RKEY, JSON.stringify(d)); } catch (e) {}
  }

  function showRaid() {
    var body = el('raid-body');
    var etat = readRaid();
    if (etat) { paintRaid(etat); return; }

    body.innerHTML = '<p class="status">Recherche de l’adversaire du jour…</p>';
    fetchBoss()
      .then(function (a) {
        return Promise.all([
          fetchInfo(a.pageid),
          fetchQuality(a.pageid),
          fetchViews(a.title || a.titles.normalized)
        ]).then(function (r) {
          var page = r[0] || {};
          var titre = (a.titles && a.titles.normalized) || a.title || page.title;
          var bytes = page.length || 40000;
          var sc = qualityScore(bytes, r[1]);
          var tier = TIERS.find(function (t) { return sc < t.max; });
          var boss = {
            title: titre,
            url: page.fullurl || ('https://' + WIKI + '.org/wiki/'
                 + encodeURIComponent(titre.replace(/ /g, '_'))),
            extract: (a.extract || page.description || '').trim().slice(0, 400),
            thumb: (page.thumbnail && page.thumbnail.source)
                   || (a.thumbnail && a.thumbnail.source) || '',
            bytes: bytes, views: r[2],
            atk: Math.max(1, Math.round(Math.log10(r[2] + 1) * 90)),
            def: Math.max(1, Math.round(Math.log10(bytes + 1) * 90)),
            score: Math.round(sc * 10) / 10,
            rank: tier.name
          };
          var pv = Math.round(boss.def * 10);
          var etat2 = {
            date: jour(), boss: boss, pv: pv, pvMax: pv,
            utilisees: [], vaincu: false, journal: []
          };
          writeRaid(etat2);
          paintRaid(etat2);
        });
      })
      .catch(function (err) {
        body.innerHTML = '<p class="status error">Adversaire du jour introuvable ('
          + esc(err.message) + '). Réessayez plus tard.</p>';
      });
  }

  function paintRaid(etat) {
    var b = etat.boss, t = tierOf(b.rank);
    var pct = Math.max(0, etat.pv / etat.pvMax * 100);
    var visuel = b.thumb
      ? '<img class="boss-img" src="' + esc(b.thumb) + '" alt="">'
      : '<div class="boss-art">' + artSVG(b.title, t.color) + '</div>';

    var dispo = Object.keys(collection)
      .map(function (k) { return collection[k]; })
      .filter(function (c) { return etat.utilisees.indexOf(c.title) === -1; })
      .sort(function (x, y) { return degats(y, b) - degats(x, b); });

    var html = '';

    if (etat.vaincu) {
      html += '<div class="win"><h3>Adversaire vaincu</h3>'
        + '<p>Un nouvel article vous attend demain.</p></div>';
    }

    html += '<div class="boss" style="--tier:' + t.color + '">'
      + '<p class="boss-tag">ARTICLE DU JOUR · ' + esc(b.rank.toUpperCase()) + '</p>'
      + '<h2>' + esc(b.title) + '</h2>'
      + visuel
      + '<p>' + esc(b.extract || 'Aucun résumé disponible.') + '</p>'
      + '<div class="bar"><span style="width:' + pct.toFixed(1) + '%"></span>'
      + '<b>' + etat.pv.toLocaleString('fr-FR') + ' / '
      + etat.pvMax.toLocaleString('fr-FR') + ' PV</b></div>'
      + '<div class="boss-meta"><span>ATQ <b>' + b.atk + '</b></span>'
      + '<span>DÉF <b>' + b.def + '</b></span>'
      + '<span>Qualité <b>' + b.score + '</b></span></div>'
      + '<div class="paliers">' + PALIERS.map(function (pl, i) {
          var atteint = (etat.paliers || []).indexOf(i) !== -1;
          var pris = (etat.reclames || []).indexOf(i) !== -1;
          var cls = 'palier' + (pris ? ' pris' : (atteint ? ' pret' : ''));
          var lib = Math.round(pl.seuil * 100) + '%<br>'
            + (pris ? 'reçu' : '+' + pl.gain + (pl.gain > 1 ? ' paquets' : ' paquet'));
          return atteint && !pris
            ? '<button class="' + cls + '" data-claim="' + i + '">' + lib + '</button>'
            : '<span class="' + cls + '">' + lib + '</span>';
        }).join('') + '</div>'
      + '<p class="recompense-msg" id="recompense-msg">'
      + ((etat.paliers || []).some(function (i) {
            return (etat.reclames || []).indexOf(i) === -1; })
          ? 'Touchez une récompense pour l’encaisser.' : '')
      + '</p>'
      + '</div>';

    if (etat.journal.length) {
      html += '<div class="journal">' + etat.journal.slice(-6).map(function (l) {
        return '<div>' + l + '</div>';
      }).join('') + '</div>';
    }

    if (!etat.vaincu) {
      var places = MAX_COMBATTANTS - etat.utilisees.length;
      html += '<p class="raid-title">VOS COMBATTANTS — ' + places + ' place'
        + (places > 1 ? 's' : '') + ' sur ' + MAX_COMBATTANTS + ' aujourd’hui</p>';

      if (places <= 0) {
        html += '<p class="status">Vos ' + MAX_COMBATTANTS
          + ' combattants du jour ont donné. Revenez demain — '
          + 'seules vos meilleures cartes comptent, pas leur nombre.</p>';
      } else if (!dispo.length) {
        html += '<p class="status">Votre collection est vide. '
          + 'Ouvrez un paquet pour recruter des combattants.</p>';
      } else {
        var equipe = dispo.slice(0, places);
        var total = equipe.reduce(function (n, c) { return n + degats(c, b); }, 0);
        html += '<p class="puissance">Vos ' + equipe.length + ' meilleures cartes valent <b>'
          + total.toLocaleString('fr-FR') + '</b> dégâts, sur '
          + etat.pv.toLocaleString('fr-FR') + ' PV restants'
          + (total >= etat.pv
              ? ' — de quoi l’achever.'
              : ' — il manque ' + (etat.pv - total).toLocaleString('fr-FR') + '.')
          + '</p>'
          + '<button class="btn btn-solid" data-allin="1">Envoyer les '
          + equipe.length + ' meilleures</button>';
        html += dispo.slice(0, 30).map(function (c) {
          var ct = tierOf(c.rank);
          return '<button class="fighter" style="--tier:' + ct.color + '" '
            + 'data-attack="' + esc(c.title) + '">'
            + '<span class="fighter-name">' + esc(c.title) + '</span>'
            + '<span class="rank" style="color:' + ct.color + '">' + ct.short + '</span>'
            + '<span class="fighter-dmg">−' + degats(c, b) + '</span>'
            + '</button>';
        }).join('');
      }
    }

    el('raid-body').innerHTML = html;
  }

  function toutAttaquer() {
    var etat = readRaid();
    if (!etat || etat.vaincu) return;
    var b = etat.boss;
    var dispo = Object.keys(collection)
      .map(function (k) { return collection[k]; })
      .filter(function (c) { return etat.utilisees.indexOf(c.title) === -1; })
      .sort(function (x, y) { return degats(y, b) - degats(x, b); });
    dispo = dispo.slice(0, MAX_COMBATTANTS - etat.utilisees.length);
    if (!dispo.length) return;

    var totalDeg = 0;
    dispo.forEach(function (c) {
      if (etat.pv === 0) return;
      var d = degats(c, b);
      etat.pv = Math.max(0, etat.pv - d);
      etat.utilisees.push(c.title);
      noterCoup(d);
      totalDeg += d;
    });
    etat.journal.push('<b>' + dispo.length + ' cartes</b> infligent '
      + totalDeg.toLocaleString('fr-FR') + ' dégâts.');
    verifierPaliers(etat);
    writeRaid(etat);
    paintRaid(etat);
  }

  /* Verifie les paliers franchis et verse les paquets correspondants. */
  /* Marque les paliers atteints. Les paquets ne sont pas verses ici :
     le joueur les reclame lui-meme, ce qui evite de les perdre
     quand la reserve est deja pleine. */
  function verifierPaliers(etat) {
    var part = 1 - (etat.pv / etat.pvMax);
    etat.paliers = etat.paliers || [];
    etat.reclames = etat.reclames || [];
    PALIERS.forEach(function (pl, i) {
      if (part + 1e-9 >= pl.seuil && etat.paliers.indexOf(i) === -1) {
        etat.paliers.push(i);
        etat.journal.push('<b>' + pl.nom + '</b> — récompense débloquée.');
      }
    });
    if (etat.pv === 0 && !etat.vaincu) {
      etat.vaincu = true;
      var st = readStats();
      st.boss = (st.boss || 0) + 1;
      writeStats(st);
    }
  }

  function noterCoup(d) {
    var st = readStats();
    if (d > (st.coupMax || 0)) { st.coupMax = d; writeStats(st); }
  }

  function reclamer(i) {
    var etat = readRaid();
    if (!etat) return;
    i = parseInt(i, 10);
    etat.reclames = etat.reclames || [];
    if ((etat.paliers || []).indexOf(i) === -1) return;
    if (etat.reclames.indexOf(i) !== -1) return;

    var pk = readPacks();
    if (pk.n >= MAX_PAQUETS) {
      el('recompense-msg').textContent =
        'Réserve pleine (' + MAX_PAQUETS + '/' + MAX_PAQUETS
        + '). Ouvrez des paquets, puis revenez réclamer.';
      return;
    }
    var gain = Math.min(PALIERS[i].gain, MAX_PAQUETS - pk.n);
    pk.n += gain;
    writePacks(pk);
    etat.reclames.push(i);
    etat.journal.push('<b>' + PALIERS[i].nom + '</b> — ' + gain
      + (gain > 1 ? ' paquets récupérés.' : ' paquet récupéré.')
      + (gain < PALIERS[i].gain ? ' (réserve pleine, le reste est perdu)' : ''));
    writeRaid(etat);
    refreshPacks();
    paintRaid(etat);
  }

  function attaquer(titre) {
    var etat = readRaid();
    var c = collection[titre];
    if (!etat || !c || etat.vaincu) return;
    if (etat.utilisees.indexOf(titre) !== -1) return;
    if (etat.utilisees.length >= MAX_COMBATTANTS) return;

    var d = degats(c, etat.boss);
    etat.pv = Math.max(0, etat.pv - d);
    etat.utilisees.push(titre);
    noterCoup(d);
    etat.journal.push('<b>' + esc(titre) + '</b> inflige ' + d + ' dégâts.');

    verifierPaliers(etat);
    writeRaid(etat);
    paintRaid(etat);
  }

  /* ---------- echange par code ----------
     Pas de serveur : la carte est encodee dans une courte chaine que le joueur
     transmet comme il veut. Le code ne porte que l'essentiel (titre et stats) ;
     le resume et l'image sont refetches a l'arrivee. */

  var CKEY = 'wikigacha:codes';

  function enc64(str) {
    var u = new TextEncoder().encode(str), s = '';
    u.forEach(function (c) { s += String.fromCharCode(c); });
    return btoa(s).replace(/=+$/, '').replace(/\+/g, '-').replace(/\//g, '_');
  }
  function dec64(b) {
    b = b.replace(/-/g, '+').replace(/_/g, '/');
    var s = atob(b), u = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
    return new TextDecoder().decode(u);
  }

  function faireCode(c) {
    return 'WG1-' + enc64(JSON.stringify({
      t: c.title, r: rankIndex(c.rank), a: c.atk, d: c.def,
      b: c.bytes, v: c.views, s: c.score
    }));
  }

  function lireCode(code) {
    code = (code || '').trim().replace(/\s+/g, '');
    if (code.indexOf('WG1-') !== 0) throw new Error('Ce n’est pas un code Wikigacha.');
    var o = JSON.parse(dec64(code.slice(4)));
    if (!o.t || typeof o.r !== 'number' || !TIERS[o.r]) throw new Error('Code abîmé.');
    return o;
  }

  function codesUtilises() {
    try { return JSON.parse(localStorage.getItem(CKEY)) || []; } catch (e) { return []; }
  }
  function marquerCode(code) {
    var l = codesUtilises();
    l.push(code.slice(-24));
    if (l.length > 400) l = l.slice(-400);
    try { localStorage.setItem(CKEY, JSON.stringify(l)); } catch (e) {}
  }

  /* Offrir : la carte quitte reellement la collection. */
  function offrir(titre) {
    var c = collection[titre];
    if (!c) return;
    var code = faireCode(c);
    if (c.count > 1) { c.count -= 1; } else { delete collection[titre]; }
    save(); refreshCount(); refreshSucces();

    var inner = el('sheet-inner');
    inner.innerHTML = '<h2>Carte offerte</h2>'
      + '<p class="sheet-sub">' + esc(titre.toUpperCase()) + '</p>'
      + '<p class="sheet-text">Transmettez ce code à qui vous voulez. '
      + 'La carte a quitté votre collection.</p>'
      + '<textarea class="code-zone" id="code-zone" readonly rows="4">' + code + '</textarea>'
      + '<div class="sheet-actions">'
      + '<button class="btn" id="sheet-close">Fermer</button>'
      + '<button class="btn" id="code-copier">Copier le code</button></div>';
    el('sheet-close').addEventListener('click', closeSheet);
    el('code-copier').addEventListener('click', function () {
      var z = el('code-zone');
      z.select(); z.setSelectionRange(0, 99999);
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      if (navigator.clipboard) navigator.clipboard.writeText(z.value).catch(function () {});
      el('code-copier').textContent = ok || navigator.clipboard ? 'Copié' : 'Sélectionnez et copiez';
    });
  }

  function recevoir() {
    var champ = el('code-champ');
    var msg = el('echange-msg');
    var code = (champ.value || '').trim().replace(/\s+/g, '');
    if (!code) return;
    var o;
    try { o = lireCode(code); }
    catch (e) { msg.textContent = e.message; return; }

    if (codesUtilises().indexOf(code.slice(-24)) !== -1) {
      msg.textContent = 'Ce code a déjà été utilisé sur cet appareil.';
      return;
    }
    var tier = TIERS[o.r];
    var carte = {
      title: o.t,
      url: 'https://' + WIKI + '.org/wiki/' + encodeURIComponent(o.t.replace(/ /g, '_')),
      desc: '', extract: '', thumb: '',
      bytes: o.b || 1, views: o.v || 0,
      atk: o.a || 1, def: o.d || 1, score: o.s,
      rank: tier.name, count: 1
    };
    var e = collection[o.t];
    if (e) { e.count += 1; } else { collection[o.t] = carte; }
    marquerCode(code);
    save(); refreshCount(); refreshSucces();
    champ.value = '';
    msg.textContent = o.t + ' (' + tier.name + ') rejoint votre collection.';
    showCollection();

    /* On complete la fiche depuis Wikipedia, sans bloquer. */
    fetchSummary(o.t).then(function (d) {
      var c2 = collection[o.t];
      if (!c2) return;
      c2.extract = (d.extract || '').trim().slice(0, 1400);
      c2.desc = d.description || '';
      c2.thumb = (d.thumbnail && d.thumbnail.source) || '';
      save(); showCollection();
    }).catch(function () {});
  }

  /* ---------- succes ---------- */

  /* Chaque succes se lit : un objectif chiffre, une mesure, une recompense.
     La progression est calculee a la volee depuis la collection et les stats,
     donc rien a maintenir en double. */
  function mesures() {
    var items = Object.keys(collection).map(function (k) { return collection[k]; });
    var st = readStats();
    var pk = readPacks();
    var parRang = {};
    TIERS.forEach(function (t) { parRang[t.name] = 0; });
    var octets = 0, vuesMax = 0, doublonMax = 0, sansImage = 0, muettes = 0;
    var initiales = {};
    items.forEach(function (c) {
      parRang[c.rank] = (parRang[c.rank] || 0) + 1;
      octets += (c.bytes || 0) * 1;
      if ((c.views || 0) > vuesMax) vuesMax = c.views;
      if ((c.views || 0) === 0) muettes += 1;
      if (!c.thumb) sansImage += 1;
      if (c.count > doublonMax) doublonMax = c.count;
      initiales[c.title.charAt(0).toUpperCase()] = 1;
    });
    return {
      distincts: items.length,
      tirees: items.reduce(function (n, c) { return n + c.count; }, 0),
      rang: parRang, octets: octets, vuesMax: vuesMax,
      doublonMax: doublonMax, sansImage: sansImage, muettes: muettes,
      initiales: Object.keys(initiales).length,
      paquets: pk.ouverts || 0,
      boss: st.boss || 0, coupMax: st.coupMax || 0, jours: st.jours || 1
    };
  }

  var SUCCES = [

    { g: 'Raretés', id: 'ss3', n: 'Vitrine',            d: 'Trois Super spéciales rares',   v: 3,  gain: 4, m: function (x) { return x.rang['Super spéciale rare']; } },

    { g: 'Paquets', id: 'p200', n: 'Ouvreur compulsif',   d: '200 paquets ouverts', v: 200, gain: 3, m: function (x) { return x.paquets; } },

    { g: 'Paquets', id: 'd8',   n: 'Insistance',          d: 'Une carte en 8 exemplaires', v: 8, gain: 2, m: function (x) { return x.doublonMax; } },

    { g: 'Raid', id: 'b1',   n: 'Premier tombé',   d: 'Vaincre un article du jour',      v: 1,    gain: 2, m: function (x) { return x.boss; } },
    { g: 'Raid', id: 'b5',   n: 'Chasseur',        d: 'Vaincre cinq articles du jour',   v: 5,    gain: 3, m: function (x) { return x.boss; } },
    { g: 'Raid', id: 'b20',  n: 'Fléau du jour',   d: 'Vaincre vingt articles du jour',  v: 20,   gain: 5, m: function (x) { return x.boss; } },
    { g: 'Raid', id: 'k500', n: 'Coup de bélier',  d: '500 dégâts en une attaque',       v: 500,  gain: 2, m: function (x) { return x.coupMax; } },

    { g: 'Curiosités', id: 'j3',   n: 'Trois jours de suite', d: 'Revenir trois jours consécutifs', v: 3,       gain: 2, m: function (x) { return x.jours; } },
    { g: 'Curiosités', id: 'j7',   n: 'Une semaine',          d: 'Revenir sept jours consécutifs',  v: 7,       gain: 4, m: function (x) { return x.jours; } },
    { g: 'Curiosités', id: 'mo1',  n: 'Un mégaoctet de savoir', d: 'Un million d’octets collectés', v: 1000000, gain: 3, m: function (x) { return x.octets; } },
    { g: 'Curiosités', id: 'foule',n: 'La foule',             d: 'Une carte à 100 000 vues',        v: 100000,  gain: 3, m: function (x) { return x.vuesMax; } },
    { g: 'Curiosités', id: 'ghost',n: 'Personne n’est venu',  d: 'Cinq articles à zéro vue',        v: 5,       gain: 2, m: function (x) { return x.muettes; } },
    { g: 'Curiosités', id: 'noimg',n: 'Sans illustration',    d: 'Vingt cartes sans image',         v: 20,      gain: 2, m: function (x) { return x.sansImage; } },
    { g: 'Curiosités', id: 'abc',  n: 'Tout l’alphabet',      d: 'Vingt initiales différentes',     v: 20,      gain: 3, m: function (x) { return x.initiales; } },
    { g: 'Curiosités', id: 'stub', n: 'Éloge de l’ébauche',   d: 'Cent cartes Communes',            v: 100,     gain: 2, m: function (x) { return x.rang['Commune']; } }
  ];

  function reclamerSucces(id) {
    var st = readStats();
    var sc = SUCCES.filter(function (a) { return a.id === id; })[0];
    if (!sc || st.reclames.indexOf(id) !== -1) return;
    var x = mesures();
    if ((sc.m(x) || 0) < sc.v) return;

    var pk = readPacks();
    if (pk.n >= MAX_PAQUETS) {
      el('succes-msg').textContent = 'Réserve pleine. Ouvrez des paquets, puis revenez.';
      return;
    }
    pk.n = Math.min(MAX_PAQUETS, pk.n + sc.gain);
    writePacks(pk);
    st.reclames.push(id);
    writeStats(st);
    refreshPacks();
    showSucces();
  }

  function refreshSucces() {
    var x = mesures(), st = readStats();
    var faits = SUCCES.filter(function (a) { return (a.m(x) || 0) >= a.v; }).length;
    var prets = SUCCES.filter(function (a) {
      return (a.m(x) || 0) >= a.v && st.reclames.indexOf(a.id) === -1;
    }).length;
    el('succes-count').textContent = prets ? '(' + prets + ')' : '';
    el('succes-count').style.color = prets ? '#c9992e' : '';
    return { x: x, st: st, faits: faits };
  }

  function showSucces() {
    var r = refreshSucces(), x = r.x, st = r.st;
    var html = '<p class="succes-tete"><b>' + r.faits + '</b> succès sur <b>'
      + SUCCES.length + '</b> · série de <b>' + x.jours + '</b> jour'
      + (x.jours > 1 ? 's' : '') + '</p>'
      + '<p class="recompense-msg" id="succes-msg"></p>';

    var groupe = null;
    SUCCES.forEach(function (a) {
      if (a.g !== groupe) { groupe = a.g; html += '<p class="succes-groupe">' + groupe.toUpperCase() + '</p>'; }
      var val = a.m(x) || 0;
      var fait = val >= a.v;
      var pris = st.reclames.indexOf(a.id) !== -1;
      var cls = 'succes' + (pris ? ' fait' : (fait ? ' pret' : ''));
      var pct = Math.min(100, val / a.v * 100);
      html += '<' + (fait && !pris ? 'button' : 'div') + ' class="' + cls + '"'
        + (fait && !pris ? ' data-succes="' + a.id + '"' : '') + '>'
        + '<span class="succes-txt"><span class="succes-nom">' + esc(a.n) + '</span>'
        + '<span class="succes-desc">' + esc(a.d) + '</span>'
        + (fait ? '' : '<span class="succes-prog">'
            + val.toLocaleString('fr-FR') + ' / ' + a.v.toLocaleString('fr-FR')
            + '<span class="jauge"><span style="width:' + pct.toFixed(0) + '%"></span></span></span>')
        + '</span>'
        + '<span class="succes-gain">' + (pris ? 'reçu' : '+' + a.gain) + '</span>'
        + '</' + (fait && !pris ? 'button' : 'div') + '>';
    });
    el('succes-body').innerHTML = html;
  }

  /* ---------- collection ---------- */

  function showCollection() {
    var items = Object.keys(collection).map(function (k) { return collection[k]; });
    el('coll-empty').hidden = items.length > 0;
    el('coll-stats').hidden = items.length === 0;

    if (items.length) {
      var total = items.reduce(function (s, c) { return s + c.count; }, 0);
      var pips = TIERS.map(function (t) {
        var n = items.filter(function (c) { return c.rank === t.name; }).length;
        return '<span class="pip" style="color:' + t.color + '">'
          + t.name.toUpperCase() + ' ' + n + '</span>';
      }).join('');
      el('coll-stats').innerHTML = '<b>' + items.length + '</b> articles distincts sur <b>'
        + total + '</b> cartes tirées<div class="ladder">' + pips + '</div>';
    }

    items.sort(function (a, b) {
      var d = rankIndex(b.rank) - rankIndex(a.rank);
      return d !== 0 ? d : a.title.localeCompare(b.title, 'fr');
    });
    el('coll-grid').innerHTML = items.map(function (c) { return cardHTML(c, c.count); }).join('');
  }

  function switchTo(which) {
    ['open', 'coll', 'raid', 'succes'].forEach(function (v) {
      el('view-' + v).hidden = (v !== which);
      el('tab-' + v).classList.toggle('is-active', v === which);
    });
    if (which === 'coll') showCollection();
    if (which === 'raid') showRaid();
    if (which === 'succes') showSucces();
  }

  el('pack').addEventListener('click', openPack);
  el('again').addEventListener('click', function () { resetPack(); openPack(); });
  el('sheet-inner').addEventListener('click', function (e) {
    e.stopPropagation();
    var o = e.target.closest ? e.target.closest('[data-offrir]') : null;
    if (o) offrir(o.getAttribute('data-offrir'));
  });
  el('code-valider').addEventListener('click', recevoir);
  el('code-champ').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') recevoir();
  });
  el('flipper').addEventListener('click', onFlip);
  el('flipper').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onFlip(null); }
  });
  el('tab-open').addEventListener('click', function () { switchTo('open'); });
  el('tab-coll').addEventListener('click', function () { switchTo('coll'); });
  el('tab-raid').addEventListener('click', function () { switchTo('raid'); });
  el('tab-succes').addEventListener('click', function () { switchTo('succes'); });
  el('succes-body').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-succes]') : null;
    if (b) reclamerSucces(b.getAttribute('data-succes'));
  });
  el('raid-body').addEventListener('click', function (e) {
    if (!e.target.closest) return;
    var cl = e.target.closest('[data-claim]');
    if (cl) { reclamer(cl.getAttribute('data-claim')); return; }
    if (e.target.closest('[data-allin]')) { toutAttaquer(); return; }
    var f = e.target.closest('[data-attack]');
    if (f) attaquer(f.getAttribute('data-attack'));
  });
  el('goto-open').addEventListener('click', function () { switchTo('open'); });
  el('sheet').addEventListener('click', function (e) {
    if (e.target === el('sheet')) closeSheet();
  });
  document.addEventListener('click', function (e) {
    var card = e.target.closest ? e.target.closest('.card') : null;
    if (card) openSheet(card.getAttribute('data-title'));
  });

  load();
  pointerPresence();
  refreshCount();
  refreshSucces();
  refreshPacks();
  setInterval(refreshPacks, 1000);
})();
</script>
</body>
</html>
