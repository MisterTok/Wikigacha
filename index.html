<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wikigacha</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#141826">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
<style>
  :root {
    --night:     #141826;
    --night-up:  #1e2334;
    --night-line:#2c3348;
    --ivory:     #f6f1e4;
    --ivory-dim: #e5dcc8;
    --ink:       #262119;
    --ink-soft:  #6d6555;
    --glass:     #b9c0d4;
    --glass-dim: #7c85a0;

    --t1: #8d93a3;
    --t2: #4f8d72;
    --t3: #3f79c4;
    --t4: #8b5cc7;
    --t5: #c9992e;
    --t6: #cc4c3f;

    --display: "Fraunces", Georgia, "Times New Roman", serif;
    --sans: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { background: var(--night); }
  body {
    margin: 0 auto; max-width: 640px; padding: 0 16px 56px;
    font-family: var(--sans); color: var(--glass);
    background:
      radial-gradient(120% 60% at 50% 0%, #1d2336 0%, transparent 70%),
      var(--night);
    min-height: 100vh;
    -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
  }

  .masthead { padding: 26px 0 0; }
  .masthead h1 {
    font-family: var(--display); font-weight: 600; font-size: 36px;
    line-height: 1; margin: 0; color: var(--ivory); letter-spacing: -0.015em;
  }
  .tagline { margin: 8px 0 16px; font-size: 13px; color: var(--glass-dim); }
  .tabs { display: flex; gap: 8px; margin-bottom: 22px; }
  .tab {
    flex: 1; padding: 10px 12px; font: inherit; font-size: 13px;
    background: var(--night-up); color: var(--glass);
    border: 1px solid var(--night-line); cursor: pointer;
  }
  .tab.is-active { background: var(--ivory); color: var(--ink); border-color: var(--ivory); }
  :focus-visible { outline: 2px solid var(--t3); outline-offset: 2px; }
  #coll-count { opacity: .7; font-variant-numeric: tabular-nums; }

  /* --- paquet --- */
  .pack-stage { text-align: center; padding: 30px 0 10px; }
  .pack {
    width: 176px; height: 248px; cursor: pointer; position: relative;
    border: 1px solid #3a4260;
    background:
      repeating-linear-gradient(135deg, transparent 0 9px, rgba(255,255,255,.022) 9px 18px),
      linear-gradient(165deg, #2b3149 0%, #191d2c 100%);
    color: var(--ivory);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    box-shadow: 0 14px 34px rgba(0,0,0,.5), inset 0 0 0 6px rgba(201,153,46,.13);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .pack:active { transform: translateY(3px) scale(.985); box-shadow: 0 8px 20px rgba(0,0,0,.5); }
  .pack-w {
    font-family: var(--display); font-size: 78px; line-height: 1;
    background: linear-gradient(160deg, #f3dfa4, #c9992e 55%, #f6ecc9);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .pack-label { font-size: 11px; letter-spacing: .12em; color: var(--glass-dim); }
  .pack[disabled] { opacity: .4; }
  .hint { font-size: 12px; color: var(--glass-dim); margin: 16px 0 0; }

  /* --- révélation --- */
  .reveal { padding: 18px 0 8px; text-align: center; }
  .counter { font-size: 12px; color: var(--glass-dim); margin: 0 0 16px; font-variant-numeric: tabular-nums; }
  .flipper {
    width: 100%; max-width: 296px; margin: 0 auto;
    aspect-ratio: 5 / 7; position: relative; perspective: 1300px; cursor: pointer;
  }
  .flip-inner {
    position: absolute; inset: 0; transform-style: preserve-3d;
    transition: transform .6s cubic-bezier(.28,.9,.32,1);
  }
  .flipper.is-open .flip-inner { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; overflow: hidden;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    display: flex; flex-direction: column;
    box-shadow: 0 16px 38px rgba(0,0,0,.55);
  }
  .face-back {
    align-items: center; justify-content: center; gap: 10px;
    border: 1px solid #3a4260; color: var(--ivory);
    background:
      repeating-linear-gradient(135deg, transparent 0 9px, rgba(255,255,255,.022) 9px 18px),
      linear-gradient(165deg, #2b3149 0%, #191d2c 100%);
    box-shadow: 0 16px 38px rgba(0,0,0,.55), inset 0 0 0 6px rgba(201,153,46,.13);
  }
  .face-back .pack-w { font-size: 84px; }
  .face-back small { font-size: 10px; letter-spacing: .14em; color: var(--glass-dim); }

  .face-front {
    transform: rotateY(180deg);
    background: var(--ivory); color: var(--ink);
    border: 1px solid var(--tier, var(--t1));
    padding: 10px;
  }
  .ribbon {
    font-size: 10px; letter-spacing: .16em; text-align: center;
    padding: 5px 0; margin: -10px -10px 10px;
    background: var(--tier); color: #fff;
  }
  .fig {
    flex: 1 1 auto; min-height: 84px; overflow: hidden;
    border: 1px solid var(--ivory-dim); background: #efe8d6;
    display: grid; place-items: center;
  }
  .fig img, .fig .art { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-thumb-alt { padding: 0; overflow: hidden; }
  .card-thumb-alt .art { width: 100%; height: 100%; display: block; }
  .sheet-art {
    height: 150px; overflow: hidden; border: 1px solid var(--ivory-dim); margin-bottom: 15px;
  }
  .sheet-art .art { width: 100%; height: 100%; display: block; }
  .face-front h2 {
    font-family: var(--display); font-weight: 600; font-size: 20px;
    line-height: 1.15; margin: 10px 0 3px;
  }
  .face-front > p {
    margin: 0; font-size: 12px; line-height: 1.5; color: var(--ink-soft);
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
  }
  .face-foot {
    display: flex; gap: 14px; margin-top: 9px; padding-top: 8px;
    border-top: 1px solid var(--ivory-dim); font-size: 12px; color: var(--ink-soft);
  }
  .face-foot b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .more {
    margin-left: auto; font: inherit; font-size: 11px; cursor: pointer;
    padding: 3px 8px; color: var(--tier); background: transparent;
    border: 1px solid var(--tier); border-radius: 0;
  }

  .flipper.foil .face-front::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(115deg,
      transparent 28%, rgba(255,255,255,.9) 46%,
      rgba(255,236,180,.75) 54%, transparent 72%);
    transform: translateX(-130%);
  }
  .flipper.foil.is-open .face-front::after { animation: sweep 1.1s .45s ease-out; }
  @keyframes sweep { to { transform: translateX(130%); } }

  .flipper.holo .face-front::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1;
    mix-blend-mode: color; opacity: 0;
    background: linear-gradient(125deg, #ff6b8a, #ffd166, #4ade9b, #4cc9f0, #b57bff, #ff6b8a);
    background-size: 300% 300%;
  }
  .flipper.holo.is-open .face-front::before { animation: holo 3.4s .5s ease-in-out infinite; }
  @keyframes holo {
    0%, 100% { opacity: .18; background-position: 0% 50%; }
    50%      { opacity: .34; background-position: 100% 50%; }
  }

  .tap-on { font-size: 12px; color: var(--glass-dim); margin: 18px 0 0; }

  /* --- listes --- */
  .draw, .grid { display: grid; gap: 10px; padding: 10px 0 20px; }
  @media (min-width: 470px) { .grid { grid-template-columns: 1fr 1fr; } }

  .card {
    display: block; width: 100%; text-align: left; cursor: pointer;
    font: inherit; color: var(--glass);
    background: var(--night-up);
    border: 1px solid var(--night-line);
    border-left: 5px solid var(--tier, var(--t1));
    padding: 11px 13px;
  }
  .card-head { display: flex; gap: 12px; align-items: flex-start; }
  .card-thumb, .card-thumb-alt {
    width: 54px; height: 54px; flex: none;
    border: 1px solid var(--night-line); background: #262c40;
  }
  .card-thumb { object-fit: cover; }
  .card-thumb-alt {
    display: grid; place-items: center;
    font-family: var(--display); font-size: 24px; color: var(--glass-dim);
  }
  .card-title {
    display: block; font-family: var(--display); font-size: 17px;
    line-height: 1.2; margin-bottom: 3px; color: var(--ivory);
  }
  .card-desc {
    display: -webkit-box; font-size: 12px; color: var(--glass-dim);
    -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card-foot {
    display: flex; align-items: baseline; gap: 14px; margin-top: 9px;
    padding-top: 8px; border-top: 1px solid var(--night-line);
    font-size: 12px; color: var(--glass-dim);
  }
  .card-foot b { color: var(--ivory); font-variant-numeric: tabular-nums; }
  .rank { margin-left: auto; font-size: 10px; letter-spacing: .1em; color: var(--tier); }
  .dupe { font-size: 11px; }

  .status { font-size: 13px; color: var(--glass-dim); padding: 26px 4px; text-align: center; }
  .status.error { color: #ef8b8b; }
  .btn {
    display: block; width: 100%; margin: 8px 0 0; padding: 13px;
    background: var(--night-up); border: 1px solid var(--night-line);
    font: inherit; font-size: 15px; color: var(--ivory); cursor: pointer; text-align: center;
  }
  .btn:active { background: #262c40; }
  .btn-solid { background: var(--ivory); color: var(--ink); border-color: var(--ivory); }
  .empty { text-align: center; padding: 52px 0 24px; color: var(--glass-dim); font-size: 14px; }
  .coll-stats {
    font-size: 12px; color: var(--glass-dim); line-height: 1.7;
    border-bottom: 1px solid var(--night-line); padding-bottom: 12px; margin-bottom: 16px;
  }
  .coll-stats b { color: var(--ivory); font-variant-numeric: tabular-nums; }
  .ladder { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .pip {
    font-size: 10px; letter-spacing: .08em; padding: 3px 8px;
    border: 1px solid currentColor; opacity: .85;
  }

  /* --- fiche --- */
  .sheet {
    position: fixed; inset: 0; z-index: 20; background: rgba(8,10,17,.66);
    display: flex; align-items: flex-end; justify-content: center;
  }
  .sheet[hidden] { display: none; }
  .sheet-inner {
    width: 100%; max-width: 640px; max-height: 88vh; overflow-y: auto;
    background: var(--ivory); color: var(--ink);
    border-top: 4px solid var(--tier, var(--t1));
    padding: 20px 18px 30px; animation: rise .26s ease-out;
  }
  @keyframes rise { from { transform: translateY(26px); opacity: 0; } }
  .sheet-inner h2 {
    font-family: var(--display); font-weight: 600; font-size: 25px;
    line-height: 1.15; margin: 0 0 3px;
  }
  .sheet-sub { margin: 0 0 15px; font-size: 11px; letter-spacing: .1em; color: var(--tier); }
  .sheet-img {
    width: 100%; max-height: 210px; object-fit: cover;
    border: 1px solid var(--ivory-dim); margin-bottom: 15px;
  }
  .sheet-text { font-size: 15px; line-height: 1.68; margin: 0 0 16px; }
  .sheet-meta {
    font-size: 12px; color: var(--ink-soft); line-height: 1.9;
    border-top: 1px solid var(--ivory-dim); padding-top: 11px; margin-bottom: 16px;
  }
  .sheet-meta b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .sheet-actions { display: flex; gap: 10px; }
  .sheet-actions .btn {
    margin: 0; background: #fff; border-color: var(--ivory-dim);
    color: var(--ink); text-decoration: none;
  }

  .credit {
    font-size: 11px; color: var(--glass-dim); line-height: 1.7;
    border-top: 1px solid var(--night-line); padding-top: 14px; margin-top: 10px;
  }
  .credit a { color: var(--glass); }

  @media (prefers-reduced-motion: reduce) {
    .flip-inner, .pack { transition: none; }
    .sheet-inner, .flipper.foil.is-open .face-front::after,
    .flipper.holo.is-open .face-front::before { animation: none; }
  }
</style>
</head>
<body>

<header class="masthead">
  <h1>Wikigacha</h1>
  <p class="tagline">Cinq articles au hasard. À vous de voir ce que ça vaut.</p>
  <nav class="tabs">
    <button id="tab-open" class="tab is-active">Ouvrir</button>
    <button id="tab-coll" class="tab">Collection <span id="coll-count">(0)</span></button>
  </nav>
</header>

<main id="view-open">
  <div id="pack-stage" class="pack-stage">
    <button id="pack" class="pack" aria-label="Ouvrir un paquet de cinq cartes">
      <span class="pack-w">W</span>
      <span class="pack-label">5 CARTES</span>
    </button>
    <p class="hint">Touchez le paquet</p>
  </div>

  <div id="reveal" class="reveal" hidden>
    <p id="counter" class="counter"></p>
    <div id="flipper" class="flipper" role="button" tabindex="0">
      <div class="flip-inner">
        <div class="face face-back">
          <span class="pack-w">W</span>
          <small>ARTICLE INCONNU</small>
        </div>
        <div class="face face-front" id="front"></div>
      </div>
    </div>
    <p id="tap-on" class="tap-on">Touchez la carte pour la retourner</p>
  </div>

  <div id="draw" class="draw"></div>
  <div id="status" class="status" hidden></div>
  <button id="again" class="btn btn-solid" hidden>Ouvrir un autre paquet</button>
</main>

<main id="view-coll" hidden>
  <div id="coll-empty" class="empty">
    <p>Votre collection est vide.</p>
    <button id="goto-open" class="btn btn-solid">Ouvrir un premier paquet</button>
  </div>
  <div id="coll-stats" class="coll-stats" hidden></div>
  <div id="coll-grid" class="grid"></div>
</main>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-inner" id="sheet-inner"></div>
</div>

<p class="credit">
  Contenu et données issus de <a href="https://fr.wikipedia.org" target="_blank" rel="noopener">Wikipédia</a>,
  sous licence <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.fr" target="_blank" rel="noopener">CC BY-SA 4.0</a>.
</p>

<script>
(function () {
  var WIKI = 'fr.wikipedia';
  var KEY = 'wikigacha:collection';
  var collection = {};
  var queue = [], qi = 0;

  var TIERS = [
    { max: 0.72, name: 'Commun',     color: '#8d93a3', fx: '' },
    { max: 0.95, name: 'Ordinaire',  color: '#4f8d72', fx: '' },
    { max: 1.15, name: 'Rare',       color: '#3f79c4', fx: '' },
    { max: 1.38, name: 'Épique',     color: '#8b5cc7', fx: 'foil' },
    { max: 1.62, name: 'Légendaire', color: '#c9992e', fx: 'foil' },
    { max: 99,   name: 'Mythique',   color: '#cc4c3f', fx: 'foil holo' }
  ];

  var el = function (id) { return document.getElementById(id); };
  var tierOf = function (name) {
    return TIERS.find(function (t) { return t.name === name; }) || TIERS[0];
  };
  var rankIndex = function (name) {
    return TIERS.findIndex(function (t) { return t.name === name; });
  };
  var esc = function (s) {
    return String(s).replace(/[&<>"]/g, function (m) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[m];
    });
  };

  /* ---------- données ---------- */

  function fetchPack() {
    var url = 'https://' + WIKI + '.org/w/api.php'
      + '?action=query&format=json&origin=*'
      + '&generator=random&grnnamespace=0&grnlimit=5'
      + '&prop=info|pageimages|description|extracts'
      + '&inprop=url&piprop=thumbnail&pithumbsize=500'
      + '&exintro=1&explaintext=1&exlimit=max';
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (d) {
      var pages = d && d.query && d.query.pages;
      if (!pages) throw new Error('reponse vide');
      return Object.keys(pages).map(function (k) { return pages[k]; });
    });
  }

  function viewRange() {
    var n = new Date();
    var s = new Date(Date.UTC(n.getUTCFullYear(), n.getUTCMonth() - 2, 1));
    var e = new Date(Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), 0));
    var f = function (d) { return d.toISOString().slice(0, 10).replace(/-/g, '') + '00'; };
    return [f(s), f(e)];
  }

  function fetchViews(title) {
    var r = viewRange();
    var url = 'https://wikimedia.org/api/rest_v1/metrics/pageviews/per-article/'
      + WIKI + '/all-access/user/' + encodeURIComponent(title.replace(/ /g, '_'))
      + '/monthly/' + r[0] + '/' + r[1];
    return fetch(url)
      .then(function (res) { return res.ok ? res.json() : null; })
      .then(function (d) {
        if (!d || !d.items) return 0;
        return d.items.reduce(function (s, i) { return s + (i.views || 0); }, 0);
      })
      .catch(function () { return 0; });
  }

  function fetchSummary(title) {
    var url = 'https://' + WIKI + '.org/api/rest_v1/page/summary/'
      + encodeURIComponent(title.replace(/ /g, '_'));
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }

  function toCard(page, views) {
    var bytes = page.length || 1;
    var score = Math.log10(bytes + 1) / 5 + Math.log10(views + 1) / 6;
    var tier = TIERS.find(function (t) { return score < t.max; });
    return {
      title: page.title,
      url: page.fullurl || ('https://' + WIKI + '.org/wiki/' + encodeURIComponent(page.title)),
      desc: page.description || '',
      extract: (page.extract || '').trim().slice(0, 1400),
      thumb: page.thumbnail ? page.thumbnail.source : '',
      bytes: bytes, views: views,
      atk: Math.max(1, Math.round(Math.log10(views + 1) * 90)),
      def: Math.max(1, Math.round(Math.log10(bytes + 1) * 90)),
      rank: tier.name
    };
  }

  /* ---------- stockage ---------- */

  function load() {
    try { collection = JSON.parse(localStorage.getItem(KEY)) || {}; }
    catch (e) { collection = {}; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(collection)); } catch (e) {}
  }
  function add(c) {
    var e = collection[c.title];
    if (e) { e.count += 1; }
    else {
      collection[c.title] = {
        title: c.title, url: c.url, desc: c.desc, extract: c.extract, thumb: c.thumb,
        bytes: c.bytes, views: c.views, atk: c.atk, def: c.def,
        rank: c.rank, count: 1
      };
    }
    save(); refreshCount();
  }
  function refreshCount() {
    el('coll-count').textContent = '(' + Object.keys(collection).length + ')';
  }

  /* ---------- rendu ---------- */

  function blurb(c, limit) {
    var t = c.extract || c.desc || 'Cet article n\u2019a pas encore de r\u00e9sum\u00e9.';
    if (t.length <= limit) return t;
    var head = t.slice(0, limit + 40);
    var cut = Math.max(
      head.lastIndexOf('. '), head.lastIndexOf('! '),
      head.lastIndexOf('? '), head.lastIndexOf('\u2026 ')
    );
    if (cut > limit * 0.45) return head.slice(0, cut + 1);
    var sp = head.lastIndexOf(' ', limit);
    return (sp > 0 ? head.slice(0, sp) : head.slice(0, limit)) + '\u2026';
  }

  /* Illustration deterministe pour les articles sans image :
     le titre sert de graine, la carte a donc toujours le meme motif. */
  function seedOf(str) {
    var h = 2166136261;
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  function artSVG(title, color) {
    var seed = seedOf(title);
    var rnd = function () {
      seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
      return seed / 4294967296;
    };
    var mode = Math.floor(rnd() * 3);
    var body = '';
    var i, n;

    if (mode === 0) {
      n = 4 + Math.floor(rnd() * 4);
      var cx = 25 + rnd() * 50, cy = 25 + rnd() * 50;
      for (i = n; i > 0; i--) {
        body += '<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1)
          + '" r="' + (i * (8 + rnd() * 4)).toFixed(1)
          + '" fill="none" stroke="' + color
          + '" stroke-opacity="' + (0.10 + i * 0.045).toFixed(2)
          + '" stroke-width="' + (1 + rnd() * 2).toFixed(1) + '"/>';
      }
    } else if (mode === 1) {
      var x = -40;
      while (x < 140) {
        var w = 3 + rnd() * 12;
        body += '<rect x="' + x.toFixed(1) + '" y="-30" width="' + w.toFixed(1)
          + '" height="160" fill="' + color
          + '" fill-opacity="' + (0.06 + rnd() * 0.26).toFixed(2)
          + '" transform="rotate(-24 50 50)"/>';
        x += w + 2 + rnd() * 7;
      }
    } else {
      n = 4 + Math.floor(rnd() * 3);
      var step = 100 / n;
      for (i = 0; i < n * n; i++) {
        if (rnd() < 0.42) continue;
        body += '<rect x="' + ((i % n) * step).toFixed(1)
          + '" y="' + (Math.floor(i / n) * step).toFixed(1)
          + '" width="' + step.toFixed(1) + '" height="' + step.toFixed(1)
          + '" fill="' + color
          + '" fill-opacity="' + (0.05 + rnd() * 0.28).toFixed(2) + '"/>';
      }
    }

    return '<svg class="art" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"'
      + ' xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'
      + '<rect width="100" height="100" fill="#efe8d6"/>' + body
      + '<text x="50" y="50" text-anchor="middle" dominant-baseline="central"'
      + ' font-family="Fraunces, Georgia, serif" font-size="46" font-weight="600"'
      + ' fill="#262119" fill-opacity=".72">' + esc(title.charAt(0).toUpperCase())
      + '</text></svg>';
  }

  function cardHTML(c, dupes) {
    var t = tierOf(c.rank);
    var visual = c.thumb
      ? '<img class="card-thumb" src="' + esc(c.thumb) + '" alt="" loading="lazy">'
      : '<span class="card-thumb-alt">' + artSVG(c.title, t.color) + '</span>';
    return '<button class="card" style="--tier:' + t.color + '" data-title="' + esc(c.title) + '">'
      + '<span class="card-head">' + visual
      + '<span><span class="card-title">' + esc(c.title) + '</span>'
      + '<span class="card-desc">' + esc(blurb(c, 120)) + '</span></span></span>'
      + '<span class="card-foot">'
      + '<span>ATQ <b>' + c.atk + '</b></span>'
      + '<span>DÉF <b>' + c.def + '</b></span>'
      + (dupes > 1 ? '<span class="dupe">×' + dupes + '</span>' : '')
      + '<span class="rank">' + esc(c.rank.toUpperCase()) + '</span></span></button>';
  }

  function frontHTML(c) {
    var t = tierOf(c.rank);
    var fig = c.thumb
      ? '<img src="' + esc(c.thumb) + '" alt="">'
      : artSVG(c.title, t.color);
    return '<div class="ribbon">' + esc(c.rank.toUpperCase()) + '</div>'
      + '<div class="fig">' + fig + '</div>'
      + '<h2>' + esc(c.title) + '</h2>'
      + '<p>' + esc(blurb(c, 190)) + '</p>'
      + '<div class="face-foot"><span>ATQ <b>' + c.atk + '</b></span>'
      + '<span>DÉF <b>' + c.def + '</b></span>'
      + '<button class="more" data-title="' + esc(c.title) + '">Fiche complète</button>'
      + '</div>';
  }

  /* ---------- révélation ---------- */

  function showNext() {
    if (qi >= queue.length) {
      el('reveal').hidden = true;
      el('draw').innerHTML = queue.map(function (c) { return cardHTML(c, 1); }).join('');
      el('again').hidden = false;
      return;
    }
    var c = queue[qi], t = tierOf(c.rank);
    el('counter').textContent = 'Carte ' + (qi + 1) + ' sur ' + queue.length;
    el('front').innerHTML = frontHTML(c);
    el('front').style.setProperty('--tier', t.color);
    el('flipper').className = 'flipper ' + t.fx;
    el('tap-on').textContent = 'Touchez la carte pour la retourner';
  }

  function onFlip(ev) {
    var f = el('flipper');
    var more = ev && ev.target && ev.target.closest ? ev.target.closest('.more') : null;
    if (more) { openSheet(more.getAttribute('data-title')); return; }
    if (qi >= queue.length) return;
    if (!f.classList.contains('is-open')) {
      f.classList.add('is-open');
      add(queue[qi]);
      el('tap-on').textContent = (qi + 1 < queue.length)
        ? 'Touchez pour la suivante'
        : 'Touchez pour voir le paquet';
    } else {
      f.classList.remove('is-open');
      qi += 1;
      setTimeout(showNext, 260);
    }
  }

  function openPack() {
    var status = el('status');
    el('pack').disabled = true;
    el('draw').innerHTML = '';
    el('again').hidden = true;
    status.hidden = false; status.className = 'status';
    status.textContent = 'Tirage de cinq articles…';

    fetchPack()
      .then(function (pages) {
        return Promise.all(pages.map(function (p) {
          return fetchViews(p.title).then(function (v) { return toCard(p, v); });
        }));
      })
      .then(function (cards) {
        cards.sort(function (a, b) { return rankIndex(a.rank) - rankIndex(b.rank); });
        queue = cards; qi = 0;
        status.hidden = true;
        el('pack-stage').hidden = true;
        el('reveal').hidden = false;
        el('flipper').classList.remove('is-open');
        showNext();
      })
      .catch(function (err) {
        status.className = 'status error';
        status.textContent = 'Wikipédia n’a pas répondu (' + err.message + '). Réessayez.';
        el('pack').disabled = false;
      });
  }

  function resetPack() {
    el('pack-stage').hidden = false;
    el('pack').disabled = false;
    el('reveal').hidden = true;
    el('draw').innerHTML = '';
    el('again').hidden = true;
  }

  /* ---------- fiche ---------- */

  function openSheet(title) {
    var c = collection[title];
    if (!c) return;
    var t = tierOf(c.rank);
    var inner = el('sheet-inner');
    inner.style.setProperty('--tier', t.color);
    inner.innerHTML = '<h2>' + esc(c.title) + '</h2>'
      + '<p class="sheet-sub">' + esc(c.rank.toUpperCase())
      + (c.count > 1 ? ' · ' + c.count + ' EXEMPLAIRES' : '') + '</p>'
      + (c.thumb
          ? '<img class="sheet-img" src="' + esc(c.thumb) + '" alt="">'
          : '<div class="sheet-art">' + artSVG(c.title, t.color) + '</div>')
      + '<p class="sheet-text" id="sheet-text">'
      + esc(c.extract || 'Chargement du résumé…') + '</p>'
      + '<div class="sheet-meta">ATQ <b>' + c.atk + '</b> — '
      + c.views.toLocaleString('fr-FR') + ' vues sur deux mois<br>'
      + 'DÉF <b>' + c.def + '</b> — '
      + (Math.round(c.bytes / 102.4) / 10) + ' Ko d’article</div>'
      + '<div class="sheet-actions">'
      + '<button class="btn" id="sheet-close">Fermer</button>'
      + '<a class="btn" href="' + esc(c.url) + '" target="_blank" rel="noopener">Lire l’article</a>'
      + '</div>';
    el('sheet').hidden = false;
    document.body.style.overflow = 'hidden';
    el('sheet-close').addEventListener('click', closeSheet);

    if (!c.extract) {
      fetchSummary(c.title)
        .then(function (d) {
          c.extract = (d.extract || '').trim().slice(0, 1400);
          save();
          el('sheet-text').textContent = c.extract || 'Cet article n’a pas de résumé.';
        })
        .catch(function () {
          el('sheet-text').textContent = 'Résumé indisponible.';
        });
    }
  }

  function closeSheet() {
    el('sheet').hidden = true;
    document.body.style.overflow = '';
  }

  /* ---------- collection ---------- */

  function showCollection() {
    var items = Object.keys(collection).map(function (k) { return collection[k]; });
    el('coll-empty').hidden = items.length > 0;
    el('coll-stats').hidden = items.length === 0;

    if (items.length) {
      var total = items.reduce(function (s, c) { return s + c.count; }, 0);
      var pips = TIERS.map(function (t) {
        var n = items.filter(function (c) { return c.rank === t.name; }).length;
        return '<span class="pip" style="color:' + t.color + '">'
          + t.name.toUpperCase() + ' ' + n + '</span>';
      }).join('');
      el('coll-stats').innerHTML = '<b>' + items.length + '</b> articles distincts sur <b>'
        + total + '</b> cartes tirées<div class="ladder">' + pips + '</div>';
    }

    items.sort(function (a, b) {
      var d = rankIndex(b.rank) - rankIndex(a.rank);
      return d !== 0 ? d : a.title.localeCompare(b.title, 'fr');
    });
    el('coll-grid').innerHTML = items.map(function (c) { return cardHTML(c, c.count); }).join('');
  }

  function switchTo(which) {
    var isOpen = which === 'open';
    el('view-open').hidden = !isOpen;
    el('view-coll').hidden = isOpen;
    el('tab-open').classList.toggle('is-active', isOpen);
    el('tab-coll').classList.toggle('is-active', !isOpen);
    if (!isOpen) showCollection();
  }

  el('pack').addEventListener('click', openPack);
  el('again').addEventListener('click', function () { resetPack(); openPack(); });
  el('sheet-inner').addEventListener('click', function (e) { e.stopPropagation(); });
  el('flipper').addEventListener('click', onFlip);
  el('flipper').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onFlip(null); }
  });
  el('tab-open').addEventListener('click', function () { switchTo('open'); });
  el('tab-coll').addEventListener('click', function () { switchTo('coll'); });
  el('goto-open').addEventListener('click', function () { switchTo('open'); });
  el('sheet').addEventListener('click', function (e) {
    if (e.target === el('sheet')) closeSheet();
  });
  document.addEventListener('click', function (e) {
    var card = e.target.closest ? e.target.closest('.card') : null;
    if (card) openSheet(card.getAttribute('data-title'));
  });

  load();
  refreshCount();
})();
</script>
</body>
</html>
