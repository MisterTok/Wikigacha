<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test filtre homonymie — Wikigacha</title>
<style>
  body { margin:0; padding:16px 14px 40px; background:#141826; color:#e8eaf2;
         font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif; font-size:15px; line-height:1.5; }
  h1 { font-size:18px; margin:0 0 4px; color:#e6c15c; }
  p.sub { margin:0 0 18px; color:#9aa2bb; font-size:13px; }
  button { width:100%; padding:14px; margin:0 0 10px; font-size:15px; font-weight:600;
           background:#2c3452; color:#e8eaf2; border:1px solid #5b6a94; border-radius:8px; }
  button:active { background:#3a4468; }
  .bloc { margin-top:18px; border-top:1px solid #2a3048; padding-top:12px; }
  .ligne { display:flex; gap:8px; padding:6px 0; border-bottom:1px solid #20263a; }
  .etat { flex:none; width:22px; font-weight:700; }
  .ok { color:#5fcf8a; } .ko { color:#e2645a; } .info { color:#9aa2bb; }
  .titre { flex:1; min-width:0; }
  .note { color:#9aa2bb; font-size:12.5px; }
  .bilan { margin-top:12px; padding:12px; background:#1b2134; border:1px solid #2a3048;
           border-radius:8px; font-weight:600; }
</style>
</head>
<body>

<h1>Test du filtre homonymie</h1>
<p class="sub">Vérifie que les pages d'homonymie sont bien écartées, sans dépendre du hasard des tirages.</p>

<button id="b1">1 · Tester des pages connues</button>
<button id="b2">2 · Scanner 240 articles au hasard</button>

<div id="sortie"></div>

<script>
var WIKI = 'fr.wikipedia';
var API = 'https://' + WIKI + '.org/w/api.php?action=query&format=json&origin=*&formatversion=2';
var PROPS = '&prop=info|pageimages|description|extracts|pageprops'
          + '&inprop=url&piprop=thumbnail&pithumbsize=500&pilicense=any'
          + '&exintro=1&explaintext=1&exlimit=max&ppprop=disambiguation';

/* Exactement la regle appliquee dans index.html. */
function estHomonymie(p) {
  return (p.pageprops && p.pageprops.hasOwnProperty('disambiguation'))
      || /\(homonymie\)$/i.test(p.title || '');
}

var sortie = document.getElementById('sortie');
function bloc(titre) {
  var d = document.createElement('div');
  d.className = 'bloc';
  d.innerHTML = '<div class="note">' + titre + '</div>';
  sortie.appendChild(d);
  return d;
}
function ligne(parent, etat, classe, titre, note) {
  var l = document.createElement('div');
  l.className = 'ligne';
  l.innerHTML = '<div class="etat ' + classe + '">' + etat + '</div>'
              + '<div class="titre">' + titre
              + (note ? '<div class="note">' + note + '</div>' : '') + '</div>';
  parent.appendChild(l);
}
function bilan(parent, texte) {
  var b = document.createElement('div');
  b.className = 'bilan';
  b.textContent = texte;
  parent.appendChild(b);
}

/* --- Test 1 : titres connus, resultat attendu connu d'avance --- */
var CAS = [
  { t: 'Queen Elizabeth',      homonymie: true  },
  { t: 'Mercure',              homonymie: true  },
  { t: 'Orange (homonymie)',   homonymie: true  },
  { t: 'Elizabeth II',         homonymie: false },
  { t: 'Napoléon Ier',         homonymie: false },
  { t: 'Rennes',               homonymie: false }
];

document.getElementById('b1').onclick = function () {
  var d = bloc('Test 1 — pages connues');
  var titres = CAS.map(function (c) { return c.t; }).join('|');
  fetch(API + '&titles=' + encodeURIComponent(titres) + PROPS)
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var pages = (data.query && data.query.pages) || [];
      var index = {};
      pages.forEach(function (p) { index[p.title] = p; });
      var reussis = 0;
      CAS.forEach(function (c) {
        var p = index[c.t];
        if (!p) { ligne(d, '?', 'info', c.t, 'page introuvable (titre redirige ?)'); return; }
        var vu = estHomonymie(p);
        var bon = (vu === c.homonymie);
        if (bon) reussis++;
        ligne(d, bon ? '✓' : '✗', bon ? 'ok' : 'ko', c.t,
              'attendu : ' + (c.homonymie ? 'ecartee' : 'gardee')
              + ' — obtenu : ' + (vu ? 'ecartee' : 'gardee'));
      });
      bilan(d, reussis + ' / ' + CAS.length + ' corrects'
              + (reussis === CAS.length ? ' — le filtre fonctionne.' : ' — a revoir.'));
    })
    .catch(function (e) { ligne(d, '✗', 'ko', 'Erreur reseau', String(e)); });
};

/* --- Test 2 : 20 tirages reels de 12 articles, comme un vrai pack --- */
document.getElementById('b2').onclick = function () {
  var d = bloc('Test 2 — 20 tirages de 12 articles');
  var total = 0, ecartes = 0, restants = 20;
  ligne(d, '…', 'info', 'Scan en cours, patiente une vingtaine de secondes.');

  function tour() {
    if (!restants--) {
      bilan(d, total + ' articles tires · ' + ecartes + ' page(s) d\'homonymie ecartee(s) · '
              + (total - ecartes) + ' gardes');
      if (!ecartes) {
        ligne(d, 'i', 'info', 'Aucune homonymie dans ce lot',
              'Normal : elles sont rares. Le test 1 reste la preuve fiable.');
      }
      return;
    }
    fetch(API + '&generator=random&grnnamespace=0&grnlimit=12' + PROPS)
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var pages = (data.query && data.query.pages) || [];
        pages.forEach(function (p) {
          total++;
          if (estHomonymie(p)) {
            ecartes++;
            ligne(d, '✗', 'ko', p.title, 'ecartee (homonymie)');
          }
        });
        tour();
      })
      .catch(function () { tour(); });
  }
  tour();
};
</script>

</body>
</html>
